<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>收支记账本 | 全颜色调节条</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            padding: 10px 10px;
            display: flex;
            justify-content: center;
            transition: background 0.2s ease;
        }

        /* 动态变量 */
        :root {
            --card-radius: 24px;
            --card-padding: 16px;
            --stat-padding: 8px;
            --input-padding: 12px;
            --font-size-base: 18px;
            --expense-color: #c2413a;
            --income-color: #1e7b5c;
            --spacing-gap: 6px;
            --bg-color: #f1f5f9;
            --card-bg: #ffffff;
        }

        body {
            font-size: var(--font-size-base);
            background: var(--bg-color);
        }

        .container {
            max-width: 500px;
            width: 100%;
            margin: 0 auto;
        }

        .stats-row {
            display: flex;
            gap: var(--spacing-gap);
            margin-bottom: calc(var(--spacing-gap) + 2px);
        }
        .stat-card {
            flex: 1;
            background: var(--card-bg);
            border-radius: var(--card-radius);
            padding: var(--stat-padding) 4px;
            text-align: center;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.03);
            border: 1px solid rgba(0,0,0,0.05);
        }
        .stat-label {
            font-size: calc(var(--font-size-base) * 0.65);
            font-weight: 500;
            color: #6c7a8e;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 3px;
            margin-bottom: 4px;
        }
        .stat-number {
            font-size: calc(var(--font-size-base) * 1.1);
            font-weight: 700;
            font-variant-numeric: tabular-nums;
            white-space: nowrap;
        }
        .stat-card.income .stat-number { color: var(--income-color); }
        .stat-card.expense .stat-number { color: var(--expense-color); }
        .stat-card.balance .stat-number.positive { color: var(--income-color); }
        .stat-card.balance .stat-number.negative { color: var(--expense-color); }

        .date-header, .input-card, .calendar-card, .list-card {
            background: var(--card-bg);
            border-radius: var(--card-radius);
            border: 1px solid rgba(0,0,0,0.05);
            margin-bottom: var(--spacing-gap);
        }
        .date-header { padding: calc(var(--card-padding) - 2px) var(--card-padding); }
        .calendar-nav {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-bottom: 6px;
        }
        .nav-btn {
            background: rgba(0,0,0,0.05);
            border: none;
            width: 32px;
            height: 32px;
            border-radius: 28px;
            font-size: 1rem;
            cursor: pointer;
            color: #334155;
        }
        .nav-btn:active { background: rgba(0,0,0,0.1); transform: scale(0.96); }
        #currentYearMonthDay {
            font-weight: 600;
            font-size: calc(var(--font-size-base) * 1);
            color: #0f172a;
        }
        .selected-row {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-top: 2px;
            flex-wrap: wrap;
            gap: 6px;
        }
        .selected-label {
            font-size: calc(var(--font-size-base) * 0.75);
            color: #475569;
            background: rgba(0,0,0,0.04);
            padding: 3px 10px;
            border-radius: 24px;
        }
        .selected-amount {
            font-size: calc(var(--font-size-base) * 1.2);
            font-weight: 700;
        }
        .selected-amount.positive { color: var(--income-color); }
        .selected-amount.negative { color: var(--expense-color); }

        .input-card { padding: var(--card-padding); }
        .input-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: calc(var(--card-padding) - 4px);
        }
        .type-switch {
            display: flex;
            background: rgba(0,0,0,0.05);
            border-radius: 32px;
            padding: 2px;
            gap: 3px;
        }
        .type-option {
            padding: 5px 14px;
            border-radius: 28px;
            font-weight: 600;
            font-size: calc(var(--font-size-base) * 0.8);
            cursor: pointer;
            color: #5b6e8c;
        }
        .type-option.expense.active { background: var(--card-bg); color: var(--expense-color); }
        .type-option.income.active { background: var(--card-bg); color: var(--income-color); }

        .menu-container { position: relative; }
        .menu-button {
            width: 34px;
            height: 34px;
            background: rgba(0,0,0,0.05);
            border-radius: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            cursor: pointer;
        }
        .menu-dropdown {
            position: absolute;
            top: 40px;
            right: 0;
            background: var(--card-bg);
            border-radius: 20px;
            width: 170px;
            box-shadow: 0 10px 24px rgba(0,0,0,0.12);
            display: none;
            z-index: 200;
            overflow: hidden;
        }
        .menu-dropdown.show { display: block; }
        .menu-item {
            padding: 10px 14px;
            font-size: calc(var(--font-size-base) * 0.85);
            border-bottom: 1px solid rgba(0,0,0,0.05);
            cursor: pointer;
            color: #1e293b;
        }
        .menu-item:active { background: rgba(0,0,0,0.03); }

        .input-row {
            display: flex;
            gap: 10px;
            align-items: center;
        }
        .amount-box, .category-wrapper {
            flex: 1;
            background: rgba(0,0,0,0.03);
            border-radius: 40px;
            display: flex;
            align-items: center;
        }
        .amount-box { padding: 2px 14px; }
        .amount-box span {
            color: var(--expense-color);
            font-weight: 500;
            margin-right: 4px;
            font-size: calc(var(--font-size-base) * 0.85);
        }
        .amount-box input, #categoryInput {
            flex: 1;
            border: none;
            background: transparent;
            padding: var(--input-padding) 0;
            outline: none;
            font-size: calc(var(--font-size-base) * 0.9);
            width: 100%;
            color: #1e293b;
        }
        .category-wrapper { padding: 2px 12px; gap: 4px; }
        #categoryInput { font-size: calc(var(--font-size-base) * 0.85); }
        .dropdown-btn {
            background: transparent;
            border: none;
            font-size: calc(var(--font-size-base) * 0.8);
            color: #7e8b9e;
            cursor: pointer;
        }
        .category-dropdown {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: var(--card-bg);
            border-radius: 18px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
            z-index: 150;
            display: none;
            max-height: 200px;
            overflow-y: auto;
        }
        .category-dropdown.show { display: block; }
        .category-item {
            padding: 10px 14px;
            cursor: pointer;
            border-bottom: 1px solid rgba(0,0,0,0.05);
            font-size: calc(var(--font-size-base) * 0.85);
        }

        .calendar-card { padding: calc(var(--card-padding) - 2px) calc(var(--card-padding) - 2px) calc(var(--card-padding) - 4px); }
        .weekdays {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            text-align: center;
            margin-bottom: 6px;
            font-size: calc(var(--font-size-base) * 0.7);
            font-weight: 500;
            color: #6c7a8e;
        }
        .weekdays span:last-child { color: var(--expense-color); }
        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 3px;
        }
        .calendar-day {
            aspect-ratio: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: rgba(0,0,0,0.02);
            border-radius: 12px;
            cursor: pointer;
            font-size: calc(var(--font-size-base) * 0.75);
            border: 1px solid rgba(0,0,0,0.05);
        }
        .calendar-day.selected {
            background: rgba(194, 65, 58, 0.1);
            border-color: var(--expense-color);
        }
        .calendar-day.other-month { opacity: 0.4; }
        .day-number { font-weight: 500; }
        .day-expense { font-size: calc(var(--font-size-base) * 0.5); color: var(--expense-color); margin-top: 1px; }
        .day-income { font-size: calc(var(--font-size-base) * 0.5); color: var(--income-color); margin-top: 1px; }

        .list-card { padding: calc(var(--card-padding) - 2px) var(--card-padding); margin-bottom: 8px; }
        .entries-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }
        .entries-header h4 { font-size: calc(var(--font-size-base) * 0.9); font-weight: 600; color: #1e293b; }
        .view-more-btn {
            background: none;
            border: none;
            color: var(--expense-color);
            font-size: calc(var(--font-size-base) * 0.7);
            cursor: pointer;
        }
        .entries-list { list-style: none; }
        .entries-list li {
            background: rgba(0,0,0,0.02);
            border-radius: 16px;
            padding: 8px 10px;
            margin-bottom: 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid rgba(0,0,0,0.05);
        }
        .entry-info { flex: 1; }
        .entry-note { font-weight: 500; font-size: calc(var(--font-size-base) * 0.85); color: #1e293b; }
        .entry-time { font-size: calc(var(--font-size-base) * 0.6); color: #8b9ab0; margin-top: 2px; }
        .entry-actions { display: flex; gap: 12px; align-items: center; }
        .entry-amount { font-weight: 700; font-size: calc(var(--font-size-base) * 0.85); }
        .entry-amount.expense { color: var(--expense-color); }
        .entry-amount.income { color: var(--income-color); }
        .edit-btn, .delete-btn { cursor: pointer; font-size: calc(var(--font-size-base) * 0.9); opacity: 0.6; }
        .empty-state { text-align: center; color: #a0b3cc; padding: 20px; font-size: calc(var(--font-size-base) * 0.8); }

        .toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: #1e293b;
            color: white;
            padding: 8px 18px;
            border-radius: 32px;
            font-size: calc(var(--font-size-base) * 0.8);
            z-index: 1100;
        }

        .modal-overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        .settings-panel {
            background: white;
            border-radius: 28px;
            padding: 20px;
            width: 90%;
            max-width: 360px;
            max-height: 85vh;
            overflow-y: auto;
            box-shadow: 0 20px 35px rgba(0,0,0,0.2);
        }
        .settings-item {
            margin-bottom: 20px;
            border-bottom: 1px solid #f0f0f0;
            padding-bottom: 16px;
        }
        .settings-item:last-child { border-bottom: none; }
        .settings-label {
            font-size: 0.85rem;
            font-weight: 600;
            color: #334155;
            margin-bottom: 10px;
            display: block;
        }
        .settings-slider {
            width: 100%;
            margin: 8px 0;
        }
        .settings-value {
            font-size: 0.75rem;
            color: #6c7a8e;
            text-align: right;
        }
        .color-preview {
            display: flex;
            gap: 10px;
            margin-top: 8px;
            flex-wrap: wrap;
        }
        .color-option {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            cursor: pointer;
            border: 2px solid transparent;
            transition: all 0.2s;
        }
        .color-option.selected {
            border-color: #1e293b;
            transform: scale(1.05);
        }
        .theme-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 8px;
        }
        .theme-btn {
            flex: 1;
            min-width: 70px;
            padding: 8px 10px;
            border-radius: 28px;
            border: none;
            background: #f1f5f9;
            font-size: 0.7rem;
            cursor: pointer;
            transition: all 0.2s;
        }
        .theme-btn:active { transform: scale(0.96); }
        .reset-btn {
            background: #f1f5f9;
            border: none;
            padding: 10px;
            border-radius: 28px;
            width: 100%;
            margin-top: 10px;
            cursor: pointer;
            font-size: 0.85rem;
            color: #c2413a;
        }
        .close-settings-btn {
            margin-top: 12px;
            width: 100%;
            background: #f1f5f9;
            border: none;
            padding: 10px;
            border-radius: 28px;
            cursor: pointer;
            font-size: 0.85rem;
        }
        .hsl-row {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-top: 8px;
        }
        .hsl-slider {
            flex: 1;
        }
        .color-preview-block {
            width: 40px;
            height: 40px;
            border-radius: 12px;
            border: 1px solid #ddd;
        }
        .hsl-group {
            margin-top: 8px;
        }
        .hsl-sub-row {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-top: 6px;
        }
        .hsl-sub-slider {
            flex: 1;
        }
        .hsl-sub-label {
            width: 36px;
            font-size: 0.7rem;
            color: #6c7a8e;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="stats-row">
        <div class="stat-card income"><div class="stat-label">💰 本月收入</div><div class="stat-number" id="monthIncomeAmount">+RM0.00</div></div>
        <div class="stat-card expense"><div class="stat-label">💸 本月支出</div><div class="stat-number" id="monthExpenseAmount">-RM0.00</div></div>
        <div class="stat-card balance"><div class="stat-label">🧾 本月结余</div><div class="stat-number" id="monthBalanceAmount">RM0.00</div></div>
    </div>

    <div class="date-header">
        <div class="calendar-nav">
            <button class="nav-btn" id="prevMonth">←</button>
            <div id="currentYearMonthDay"></div>
            <button class="nav-btn" id="nextMonth">→</button>
        </div>
        <div class="selected-row">
            <div class="selected-label" id="selectedDateLabel"></div>
            <div class="selected-amount" id="selectedDateTotal">RM0.00</div>
        </div>
    </div>

    <div class="input-card">
        <div class="input-header">
            <div class="type-switch" id="typeSwitch">
                <div class="type-option expense active" data-type="expense">💸 支出</div>
                <div class="type-option income" data-type="income">💰 收入</div>
            </div>
            <div class="menu-container">
                <div class="menu-button" id="menuButton">☰</div>
                <div class="menu-dropdown" id="menuDropdown">
                    <div class="menu-item" id="settingsMenuItem">🎨 界面设置</div>
                    <div class="menu-item" id="statisticsMenuItem">📊 月度统计</div>
                    <div class="menu-item" id="searchMenuItem">🔍 搜索记录</div>
                    <div class="menu-item" id="manageExpenseCategories">📝 管理支出分类</div>
                    <div class="menu-item" id="manageIncomeCategories">💰 管理收入分类</div>
                    <div class="menu-item" id="exportMenuItem">📤 导出备份</div>
                    <div class="menu-item" id="excelMenuItem">📊 导出Excel</div>
                    <div class="menu-item" id="importMenuItem">📥 导入备份</div>
                </div>
            </div>
        </div>
        <div class="input-row">
            <div class="amount-box"><span>RM</span><input type="number" id="amountInput" placeholder="0.00" step="0.01"></div>
            <div class="category-wrapper"><input type="text" id="categoryInput" placeholder="输入或选择分类"><button class="dropdown-btn" id="dropdownBtn">▼</button><div class="category-dropdown" id="categoryDropdown"></div></div>
        </div>
    </div>

    <div class="calendar-card">
        <div class="weekdays"><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span><span>日</span></div>
        <div class="calendar-grid" id="calendarGrid"></div>
    </div>

    <div class="list-card">
        <div class="entries-header"><h4>📋 今日明细 <span id="entryCount"></span></h4><button class="view-more-btn" id="viewMoreBtn" style="display: none;">查看全部</button></div>
        <ul class="entries-list" id="entriesList"></ul>
    </div>
</div>

<script>
(function(){
    const STORAGE_KEY = 'book_v9_full';
    const CAT_EXPENSE_KEY = 'book_expense_cats_full';
    const CAT_INCOME_KEY = 'book_income_cats_full';
    const SETTINGS_KEY = 'book_ui_settings';
    const DEFAULT_EXPENSE = ['🍳 早餐', '🍱 午餐', '🍽️ 晚餐', '🛍️ 购物', '🚗 交通', '🎬 娱乐', '🏠 居家', '其他'];
    const DEFAULT_INCOME = ['💼 工资', '🎁 红包', '📈 理财', '💵 兼职', '其他'];

    // 预设主题
    const THEMES = {
        '清新柔和': { expense: '#f97316', income: '#10b981', bg: '#fef9e8', cardBg: '#fffaf0' },
        '专业商务': { expense: '#be123c', income: '#0f766e', bg: '#f1f5f9', cardBg: '#ffffff' },
        '活力现代': { expense: '#e11d48', income: '#3b82f6', bg: '#f8fafc', cardBg: '#ffffff' },
        '温暖治愈': { expense: '#d97706', income: '#059669', bg: '#fff7ed', cardBg: '#fffaf0' },
        '经典原色': { expense: '#c2413a', income: '#1e7b5c', bg: '#f1f5f9', cardBg: '#ffffff' },
        '暖米风格': { expense: '#c2413a', income: '#1e7b5c', bg: '#faf3e0', cardBg: '#fffaf0' },
        '冷灰风格': { expense: '#c2413a', income: '#1e7b5c', bg: '#eef2f6', cardBg: '#f8fafc' }
    };

    let entries = [];
    let expenseCats = [...DEFAULT_EXPENSE];
    let incomeCats = [...DEFAULT_INCOME];
    let currentYear = new Date().getFullYear();
    let currentMonth = new Date().getMonth();
    let selectedDate = getLocalDate();
    let currentType = 'expense';
    let displayLimit = 5;

    let uiSettings = {
        cardRadius: 24,
        cardPadding: 16,
        statPadding: 8,
        inputPadding: 12,
        fontSize: 18,
        expenseColor: '#c2413a',
        incomeColor: '#1e7b5c',
        spacingGap: 6,
        bgColor: '#f1f5f9',
        cardBg: '#ffffff'
    };

    function getLocalDate() {
        let now = new Date();
        return `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`;
    }

    function saveSettings() {
        localStorage.setItem(SETTINGS_KEY, JSON.stringify(uiSettings));
        applyUISettings();
    }

    function loadSettings() {
        try {
            let saved = localStorage.getItem(SETTINGS_KEY);
            if(saved) {
                let loaded = JSON.parse(saved);
                uiSettings = { ...uiSettings, ...loaded };
            }
        } catch(e) {}
        applyUISettings();
    }

    function applyUISettings() {
        const root = document.documentElement;
        root.style.setProperty('--card-radius', uiSettings.cardRadius + 'px');
        root.style.setProperty('--card-padding', uiSettings.cardPadding + 'px');
        root.style.setProperty('--stat-padding', uiSettings.statPadding + 'px');
        root.style.setProperty('--input-padding', uiSettings.inputPadding + 'px');
        root.style.setProperty('--font-size-base', uiSettings.fontSize + 'px');
        root.style.setProperty('--expense-color', uiSettings.expenseColor);
        root.style.setProperty('--income-color', uiSettings.incomeColor);
        root.style.setProperty('--spacing-gap', uiSettings.spacingGap + 'px');
        root.style.setProperty('--bg-color', uiSettings.bgColor);
        root.style.setProperty('--card-bg', uiSettings.cardBg);
    }

    function applyTheme(themeName) {
        const theme = THEMES[themeName];
        if (theme) {
            uiSettings.expenseColor = theme.expense;
            uiSettings.incomeColor = theme.income;
            uiSettings.bgColor = theme.bg;
            uiSettings.cardBg = theme.cardBg;
            applyUISettings();
            saveSettings();
            showToast(`已切换至「${themeName}」主题`);
        }
    }

    // HSL 转 HEX
    function hslToHex(h, s, l) {
        s /= 100;
        l /= 100;
        let c = (1 - Math.abs(2 * l - 1)) * s;
        let x = c * (1 - Math.abs((h / 60) % 2 - 1));
        let m = l - c / 2;
        let r, g, b;
        if (h < 60) { r = c; g = x; b = 0; }
        else if (h < 120) { r = x; g = c; b = 0; }
        else if (h < 180) { r = 0; g = c; b = x; }
        else if (h < 240) { r = 0; g = x; b = c; }
        else if (h < 300) { r = x; g = 0; b = c; }
        else { r = c; g = 0; b = x; }
        let toHex = (v) => Math.round((v + m) * 255).toString(16).padStart(2, '0');
        return `#${toHex(r)}${toHex(g)}${toHex(b)}`;
    }

    // HEX 转 HSL
    function hexToHsl(hex) {
        let r = parseInt(hex.slice(1,3), 16) / 255;
        let g = parseInt(hex.slice(3,5), 16) / 255;
        let b = parseInt(hex.slice(5,7), 16) / 255;
        let max = Math.max(r, g, b), min = Math.min(r, g, b);
        let h, s, l = (max + min) / 2;
        if (max === min) h = s = 0;
        else {
            let d = max - min;
            s = l > 0.5 ? d / (2 - max - min) : d / (max + min);
            switch (max) {
                case r: h = (g - b) / d + (g < b ? 6 : 0); break;
                case g: h = (b - r) / d + 2; break;
                case b: h = (r - g) / d + 4; break;
            }
            h *= 60;
        }
        return { h: Math.round(h), s: Math.round(s * 100), l: Math.round(l * 100) };
    }

    // 以下为核心记账功能（与之前相同）
    function save() {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(entries));
        localStorage.setItem(CAT_EXPENSE_KEY, JSON.stringify(expenseCats));
        localStorage.setItem(CAT_INCOME_KEY, JSON.stringify(incomeCats));
        saveSettings();
    }
    function load() {
        try {
            let e = localStorage.getItem(STORAGE_KEY);
            if(e) entries = JSON.parse(e);
            let ec = localStorage.getItem(CAT_EXPENSE_KEY);
            if(ec) expenseCats = JSON.parse(ec);
            let ic = localStorage.getItem(CAT_INCOME_KEY);
            if(ic) incomeCats = JSON.parse(ic);
        } catch(e) {}
        loadSettings();
    }
    function getCurrentCats() { return currentType === 'expense' ? expenseCats : incomeCats; }
    function showToast(msg) { let t = document.querySelector('.toast'); if(t) t.remove(); let toast = document.createElement('div'); toast.className = 'toast'; toast.textContent = msg; document.body.appendChild(toast); setTimeout(() => toast.remove(), 1500); }
    function getDayStats(date) {
        let dayEntries = entries.filter(e => e.date === date);
        let expense = dayEntries.filter(e => e.type === 'expense').reduce((s,e) => s + e.amount, 0);
        let income = dayEntries.filter(e => e.type === 'income').reduce((s,e) => s + e.amount, 0);
        return { expense, income, balance: income - expense };
    }
    function getMonthStats(year, month) {
        let monthEntries = entries.filter(e => { let [y,m] = e.date.split('-').map(Number); return y === year && m === month + 1; });
        let expense = monthEntries.filter(e => e.type === 'expense').reduce((s,e) => s + e.amount, 0);
        let income = monthEntries.filter(e => e.type === 'income').reduce((s,e) => s + e.amount, 0);
        return { expense, income, balance: income - expense };
    }
    function renderTopCards() {
        let stats = getMonthStats(currentYear, currentMonth);
        document.getElementById('monthIncomeAmount').innerHTML = stats.income > 0 ? `+RM${stats.income.toFixed(2)}` : 'RM0.00';
        document.getElementById('monthExpenseAmount').innerHTML = stats.expense > 0 ? `-RM${stats.expense.toFixed(2)}` : 'RM0.00';
        let balVal = stats.balance;
        let balanceEl = document.getElementById('monthBalanceAmount');
        if (balVal > 0) balanceEl.innerHTML = `+RM${balVal.toFixed(2)}`;
        else if (balVal < 0) balanceEl.innerHTML = `-RM${Math.abs(balVal).toFixed(2)}`;
        else balanceEl.innerHTML = 'RM0.00';
    }
    function renderSelectedDayTotal() {
        let net = getDayStats(selectedDate).balance;
        let totalEl = document.getElementById('selectedDateTotal');
        if (net > 0) totalEl.innerHTML = `+RM${net.toFixed(2)}`;
        else if (net < 0) totalEl.innerHTML = `-RM${Math.abs(net).toFixed(2)}`;
        else totalEl.innerHTML = 'RM0.00';
        totalEl.className = 'selected-amount';
        if (net > 0) totalEl.classList.add('positive');
        else if (net < 0) totalEl.classList.add('negative');
    }
    function renderCalendar() {
        let year = currentYear, month = currentMonth;
        let firstDay = new Date(year, month, 1);
        let startOffset = firstDay.getDay() === 0 ? 6 : firstDay.getDay() - 1;
        let daysInMonth = new Date(year, month + 1, 0).getDate();
        let prevMonthDays = new Date(year, month, 0).getDate();
        let grid = document.getElementById('calendarGrid');
        grid.innerHTML = '';
        for(let i = 0; i < 42; i++) {
            let dayNum, isCurrentMonth, displayYear, displayMonth, dateStr;
            if(i < startOffset) {
                dayNum = prevMonthDays - (startOffset - i) + 1;
                isCurrentMonth = false;
                displayYear = month === 0 ? year - 1 : year;
                displayMonth = month === 0 ? 11 : month - 1;
                dateStr = `${displayYear}-${String(displayMonth+1).padStart(2,'0')}-${String(dayNum).padStart(2,'0')}`;
            } else if(i >= startOffset + daysInMonth) {
                dayNum = i - (startOffset + daysInMonth) + 1;
                isCurrentMonth = false;
                displayYear = month === 11 ? year + 1 : year;
                displayMonth = month === 11 ? 0 : month + 1;
                dateStr = `${displayYear}-${String(displayMonth+1).padStart(2,'0')}-${String(dayNum).padStart(2,'0')}`;
            } else {
                dayNum = i - startOffset + 1;
                isCurrentMonth = true;
                dateStr = `${year}-${String(month+1).padStart(2,'0')}-${String(dayNum).padStart(2,'0')}`;
            }
            let stats = getDayStats(dateStr);
            let dayDiv = document.createElement('div');
            dayDiv.className = 'calendar-day';
            if(dateStr === selectedDate) dayDiv.classList.add('selected');
            if(!isCurrentMonth) dayDiv.classList.add('other-month');
            dayDiv.setAttribute('data-date', dateStr);
            dayDiv.innerHTML = `<div class="day-number">${dayNum}</div>`;
            if(isCurrentMonth && stats.expense > 0) dayDiv.innerHTML += `<div class="day-expense">-${stats.expense.toFixed(0)}</div>`;
            if(isCurrentMonth && stats.income > 0) dayDiv.innerHTML += `<div class="day-income">+${stats.income.toFixed(0)}</div>`;
            grid.appendChild(dayDiv);
        }
        let weekdays = ['星期日','星期一','星期二','星期三','星期四','星期五','星期六'];
        let [y,m,day] = selectedDate.split('-');
        let d = new Date(y, m-1, day);
        let label = weekdays[d.getDay()];
        let today = new Date();
        if(d.toDateString() === today.toDateString()) label = `今天 · ${label}`;
        document.getElementById('selectedDateLabel').innerHTML = label;
        document.getElementById('currentYearMonthDay').innerText = `${year}年${month+1}月${day}日`;
        renderTopCards();
        renderSelectedDayTotal();
    }
    function renderEntries() {
        let dayEntries = entries.filter(e => e.date === selectedDate).sort((a,b) => b.id - a.id);
        document.getElementById('entryCount').innerText = dayEntries.length ? `(${dayEntries.length})` : '';
        let ul = document.getElementById('entriesList');
        if(dayEntries.length === 0) { ul.innerHTML = '<li class="empty-state">📝 点击日期添加记录</li>'; document.getElementById('viewMoreBtn').style.display = 'none'; return; }
        let showAll = displayLimit >= dayEntries.length;
        let display = showAll ? dayEntries : dayEntries.slice(0, displayLimit);
        ul.innerHTML = '';
        for(let e of display) {
            let sign = e.type === 'expense' ? '-' : '+';
            let cls = e.type === 'expense' ? 'expense' : 'income';
            ul.innerHTML += `<li><div class="entry-info"><div class="entry-note">${escapeHtml(e.note)}</div><div class="entry-time">${e.time}</div></div><div class="entry-actions"><span class="entry-amount ${cls}">${sign}RM${e.amount.toFixed(2)}</span><span class="edit-btn" data-id="${e.id}">✏️</span><span class="delete-btn" data-id="${e.id}">🗑</span></div></li>`;
        }
        let btn = document.getElementById('viewMoreBtn');
        if(dayEntries.length > 5) { btn.style.display = 'block'; btn.innerText = showAll ? '收起' : `查看全部(${dayEntries.length})`; }
        else btn.style.display = 'none';
        document.querySelectorAll('.delete-btn').forEach(btn => { btn.onclick = (e) => { let id = Number(btn.dataset.id); if(confirm('删除记录？')) { entries = entries.filter(e => e.id !== id); save(); renderCalendar(); renderEntries(); renderCategoryDropdown(); showToast('已删除'); } }; });
        document.querySelectorAll('.edit-btn').forEach(btn => { btn.onclick = (e) => { editEntry(Number(btn.dataset.id)); }; });
    }
    function editEntry(id) {
        let entry = entries.find(e => e.id === id);
        if(!entry) return;
        let modal = document.createElement('div');
        modal.className = 'modal-overlay';
        modal.innerHTML = `<div class="edit-panel"><h3 style="margin-bottom:14px;">✏️ 编辑记录</h3><input type="number" id="editAmount" value="${entry.amount}" step="0.01" style="width:100%; padding:10px; border-radius:28px; border:1px solid #e2e8f0; margin-bottom:10px;"><input type="text" id="editCategory" value="${escapeHtml(entry.note)}" style="width:100%; padding:10px; border-radius:28px; border:1px solid #e2e8f0; margin-bottom:16px;"><div style="display:flex; gap:10px;"><button id="saveEditBtn" style="flex:1; background:var(--expense-color); color:white; border:none; padding:10px; border-radius:32px;">保存</button><button id="cancelEditBtn" style="flex:1; background:#f1f5f9; border:none; padding:10px; border-radius:32px;">取消</button></div></div>`;
        document.body.appendChild(modal);
        document.getElementById('saveEditBtn').onclick = () => {
            let newAmount = parseFloat(document.getElementById('editAmount').value);
            if(!newAmount || newAmount <= 0) { showToast('请输入有效金额'); return; }
            let newCat = document.getElementById('editCategory').value.trim();
            if(!newCat) newCat = entry.type === 'expense' ? '其他支出' : '其他收入';
            entry.amount = newAmount; entry.note = newCat; entry.time = new Date().toLocaleTimeString('zh-CN', {hour12: false});
            save(); renderCalendar(); renderEntries(); renderCategoryDropdown(); modal.remove(); showToast('修改成功');
        };
        document.getElementById('cancelEditBtn').onclick = () => modal.remove();
        modal.onclick = (e) => { if (e.target === modal) modal.remove(); };
    }
    function addRecord() {
        let amount = parseFloat(document.getElementById('amountInput').value);
        if(!amount || amount <= 0) { showToast('请输入金额'); return false; }
        let category = document.getElementById('categoryInput').value.trim();
        if(!category) category = currentType === 'expense' ? '其他支出' : '其他收入';
        entries.push({ id: Date.now(), date: selectedDate, time: new Date().toLocaleTimeString('zh-CN', {hour12: false}), amount, note: category, type: currentType });
        save();
        document.getElementById('amountInput').value = '';
        document.getElementById('categoryInput').value = '';
        renderCalendar(); renderEntries(); renderCategoryDropdown();
        showToast(currentType === 'expense' ? '支出已记' : '收入已记');
        return true;
    }
    function renderCategoryDropdown() {
        let cats = getCurrentCats();
        let dropdown = document.getElementById('categoryDropdown');
        dropdown.innerHTML = cats.map(c => `<div class="category-item">${escapeHtml(c)}</div>`).join('');
        dropdown.querySelectorAll('.category-item').forEach(item => {
            item.onclick = () => {
                let amount = parseFloat(document.getElementById('amountInput').value);
                if(amount && amount > 0) { document.getElementById('categoryInput').value = item.innerText; addRecord(); }
                else { document.getElementById('categoryInput').value = item.innerText; showToast('请输入金额后点击分类'); }
                dropdown.classList.remove('show');
            };
        });
    }
    function openCategoryManager(type) {
        let modal = document.createElement('div'); modal.className = 'modal-overlay';
        let modalContent = document.createElement('div'); modalContent.className = 'category-manager';
        modalContent.innerHTML = `<h3 style="margin-bottom:14px;">${type === 'expense' ? '📝 管理支出分类' : '💰 管理收入分类'}</h3><div id="categoryList" style="max-height:280px; overflow-y:auto;"></div><div class="add-cat-input"><input type="text" id="newCategoryName" placeholder="新分类名称"><button id="addCategoryBtn">➕ 添加</button></div><button id="closeCatModal" style="margin-top:14px; width:100%; background:#f1f5f9; border:none; padding:10px; border-radius:32px;">关闭</button>`;
        modal.appendChild(modalContent); document.body.appendChild(modal);
        function renderCategoryList() {
            let currentCats = type === 'expense' ? expenseCats : incomeCats;
            let listDiv = modalContent.querySelector('#categoryList');
            if(currentCats.length === 0) { listDiv.innerHTML = '<div style="text-align:center; padding:16px;">暂无分类</div>'; return; }
            listDiv.innerHTML = currentCats.map((cat, idx) => `<div class="category-list-item"><span>${escapeHtml(cat)}</span><button class="delete-cat-btn" data-cat="${escapeHtml(cat)}">删除</button></div>`).join('');
            listDiv.querySelectorAll('.delete-cat-btn').forEach(btn => { btn.onclick = () => { let catName = btn.getAttribute('data-cat'); if(confirm(`确定删除「${catName}」？`)) { if(type === 'expense') { expenseCats = expenseCats.filter(c => c !== catName); if(expenseCats.length === 0) expenseCats = ['其他']; } else { incomeCats = incomeCats.filter(c => c !== catName); if(incomeCats.length === 0) incomeCats = ['其他']; } save(); renderCategoryList(); renderCategoryDropdown(); showToast('已删除'); } }; });
        }
        modalContent.querySelector('#addCategoryBtn').onclick = () => { let newCat = modalContent.querySelector('#newCategoryName').value.trim(); if(!newCat) { showToast('请输入分类'); return; } if(type === 'expense') { if(expenseCats.includes(newCat)) { showToast('已存在'); return; } expenseCats.push(newCat); } else { if(incomeCats.includes(newCat)) { showToast('已存在'); return; } incomeCats.push(newCat); } save(); modalContent.querySelector('#newCategoryName').value = ''; renderCategoryList(); renderCategoryDropdown(); showToast(`已添加「${newCat}」`); };
        modalContent.querySelector('#closeCatModal').onclick = () => modal.remove();
        modal.onclick = (e) => { if (e.target === modal) modal.remove(); };
        renderCategoryList();
    }
    function changeMonth(delta) {
        currentMonth += delta;
        if(currentMonth < 0) { currentMonth = 11; currentYear--; }
        if(currentMonth > 11) { currentMonth = 0; currentYear++; }
        let maxDay = new Date(currentYear, currentMonth+1, 0).getDate();
        let curDay = Math.min(parseInt(selectedDate.split('-')[2]), maxDay);
        selectedDate = `${currentYear}-${String(currentMonth+1).padStart(2,'0')}-${String(curDay).padStart(2,'0')}`;
        displayLimit = 5; renderCalendar(); renderEntries();
    }
    function showAllModal() {
        let dayEntries = entries.filter(e => e.date === selectedDate).sort((a,b)=>b.id-a.id);
        if(!dayEntries.length) return;
        let modal = document.createElement('div'); modal.className = 'modal-overlay';
        let html = '<div class="search-panel"><div style="display:flex; justify-content:space-between;"><h3>全部记录</h3><button id="closeModalBtn" style="background:none; border:none; font-size:1.2rem;">✕</button></div>';
        for(let e of dayEntries) { let sign = e.type==='expense'?'-':'+'; let col = e.type==='expense' ? uiSettings.expenseColor : uiSettings.incomeColor; html += `<div style="display:flex; justify-content:space-between; padding:8px; border-bottom:1px solid #edf2f7;"><div><div>${escapeHtml(e.note)}</div><div style="font-size:0.6rem;">${e.time}</div></div><div><span style="font-weight:600; color:${col}">${sign}RM${e.amount.toFixed(2)}</span><span class="delete-modal" data-id="${e.id}" style="margin-left:12px;">🗑</span><span class="edit-modal" data-id="${e.id}" style="margin-left:10px;">✏️</span></div></div>`; }
        html += '</div>';
        modal.innerHTML = html; document.body.appendChild(modal);
        modal.querySelector('#closeModalBtn').onclick = () => modal.remove();
        modal.querySelectorAll('.delete-modal').forEach(btn => { btn.onclick = () => { let id=Number(btn.dataset.id); if(confirm('删除？')){ entries=entries.filter(e=>e.id!==id); save(); modal.remove(); renderCalendar(); renderEntries(); renderCategoryDropdown(); } }; });
        modal.querySelectorAll('.edit-modal').forEach(btn => { btn.onclick = () => { let id=Number(btn.dataset.id); modal.remove(); editEntry(id); }; });
        modal.onclick = (e) => { if (e.target === modal) modal.remove(); };
    }
    function showStatistics() { 
        let stats=getMonthStats(currentYear, currentMonth); 
        let monthEntries=entries.filter(e=>{ let[y,m]=e.date.split('-'); return y===currentYear && m===currentMonth+1;}); 
        let expMap={}, incMap={}; 
        for(let e of monthEntries){ if(e.type==='expense') expMap[e.note]=(expMap[e.note]||0)+e.amount; else incMap[e.note]=(incMap[e.note]||0)+e.amount; } 
        let msg=`📊 ${currentYear}年${currentMonth+1}月\n━━━━━━\n💸 支出: RM${stats.expense.toFixed(2)}\n💰 收入: RM${stats.income.toFixed(2)}\n🧾 结余: RM${stats.balance.toFixed(2)}\n━━━━━━\n📌 支出分类:\n`; 
        for(let k in expMap) msg+=`${k}: RM${expMap[k].toFixed(2)}\n`; 
        msg+=`\n📌 收入分类:\n`; 
        for(let k in incMap) msg+=`${k}: +RM${incMap[k].toFixed(2)}\n`; 
        alert(msg); 
    }
    function showSearch() { alert('🔍 搜索功能：当前可查看每月统计和明细，后续版本将增加关键词搜索。'); }
    function exportBackup() { let backup={entries,expenseCats,incomeCats,uiSettings}; let blob=new Blob([JSON.stringify(backup)],{type:'application/json'}); let a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=`记账_${new Date().toISOString().slice(0,10)}.json`; a.click(); showToast('导出成功'); }
    function exportExcel() { if(!entries.length){showToast('无数据');return;} let csv="日期,时间,类型,分类,金额\n"; for(let e of entries){ let sign=e.type==='expense'?'-':'+'; csv+=`${e.date},${e.time},${e.type==='expense'?'支出':'收入'},${e.note},${sign}RM${e.amount.toFixed(2)}\n`; } let blob=new Blob(["\uFEFF"+csv],{type:'text/csv'}); let a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=`收支_${new Date().toISOString().slice(0,10)}.csv`; a.click(); showToast('导出CSV完成'); }
    function importBackup() { let input=document.createElement('input'); input.type='file'; input.accept='.json'; input.onchange=(e)=>{ let file=e.target.files[0]; let reader=new FileReader(); reader.onload=(ev)=>{ try{ let data=JSON.parse(ev.target.result); if(data.entries) entries=data.entries; if(data.expenseCats) expenseCats=data.expenseCats; if(data.incomeCats) incomeCats=data.incomeCats; if(data.uiSettings) uiSettings={...uiSettings,...data.uiSettings}; save(); renderCalendar(); renderEntries(); renderCategoryDropdown(); showToast('导入成功'); }catch(e){showToast('文件格式错误');} }; reader.readAsText(file); }; input.click(); }
    function bindEvents() {
        document.getElementById('calendarGrid').addEventListener('click',(e)=>{ let day=e.target.closest('.calendar-day'); if(day&&day.dataset.date){ selectedDate=day.dataset.date; let [yy,mm]=selectedDate.split('-'); currentYear=parseInt(yy); currentMonth=parseInt(mm)-1; displayLimit=5; renderCalendar(); renderEntries(); } });
        document.getElementById('prevMonth').onclick=()=>changeMonth(-1);
        document.getElementById('nextMonth').onclick=()=>changeMonth(1);
        document.getElementById('menuButton').onclick=(e)=>{ e.stopPropagation(); document.getElementById('menuDropdown').classList.toggle('show'); };
        document.addEventListener('click',()=>{ document.getElementById('menuDropdown').classList.remove('show'); document.getElementById('categoryDropdown').classList.remove('show'); });
        document.getElementById('dropdownBtn').onclick=(e)=>{ e.stopPropagation(); document.getElementById('categoryDropdown').classList.toggle('show'); renderCategoryDropdown(); };
        document.getElementById('categoryInput').onclick=()=>{ document.getElementById('categoryDropdown').classList.add('show'); renderCategoryDropdown(); };
        document.getElementById('viewMoreBtn').onclick=()=>showAllModal();
        document.getElementById('settingsMenuItem').onclick=()=>{ openSettingsPanel(); document.getElementById('menuDropdown').classList.remove('show'); };
        document.getElementById('statisticsMenuItem').onclick=()=>{ showStatistics(); document.getElementById('menuDropdown').classList.remove('show'); };
        document.getElementById('searchMenuItem').onclick=()=>{ showSearch(); document.getElementById('menuDropdown').classList.remove('show'); };
        document.getElementById('manageExpenseCategories').onclick=()=>{ openCategoryManager('expense'); document.getElementById('menuDropdown').classList.remove('show'); };
        document.getElementById('manageIncomeCategories').onclick=()=>{ openCategoryManager('income'); document.getElementById('menuDropdown').classList.remove('show'); };
        document.getElementById('exportMenuItem').onclick=()=>{ exportBackup(); document.getElementById('menuDropdown').classList.remove('show'); };
        document.getElementById('excelMenuItem').onclick=()=>{ exportExcel(); document.getElementById('menuDropdown').classList.remove('show'); };
        document.getElementById('importMenuItem').onclick=()=>{ importBackup(); document.getElementById('menuDropdown').classList.remove('show'); };
        document.querySelectorAll('.type-option').forEach(opt=>{ opt.onclick=()=>{ document.querySelectorAll('.type-option').forEach(o=>o.classList.remove('active')); opt.classList.add('active'); currentType=opt.dataset.type; renderCategoryDropdown(); }; });
        document.getElementById('amountInput').addEventListener('keypress',e=>{if(e.key==='Enter') addRecord();});
        document.getElementById('categoryInput').addEventListener('keypress',e=>{if(e.key==='Enter') addRecord();});
    }
    function escapeHtml(str) { if(!str) return ''; return str.replace(/[&<>]/g, function(m){ if(m==='&') return '&amp;'; if(m==='<') return '&lt;'; if(m==='>') return '&gt;'; return m;}); }
    
    load();
    bindEvents();
    renderCalendar();
    renderEntries();
    renderCategoryDropdown();
})();
</script>
</body>
</html>
