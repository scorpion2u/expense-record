<!DOCTYPE html>
<html lang="zh">
<head>
  <base href="/spending-tracker/">
</head>
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#c2413a" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0f172a" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="记账本">
  <link rel="apple-touch-icon" href="./icon-192.png">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>收支记账本</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div id="loadingOverlay" style="position:fixed;top:0;left:0;width:100%;height:100%;background:var(--bg-color);display:flex;align-items:center;justify-content:center;z-index:9999;transition:opacity 0.3s ease;">
    <div style="text-align:center;">
      <div class="loading-spinner" style="width:40px;height:40px;border:4px solid rgba(0,0,0,0.1);border-top-color:var(--expense-color);"></div>
      <div style="margin-top:16px;color:#64748b;font-size:14px;">加载中...</div>
    </div>
  </div>
  
  <div class="container">
    <div class="stats-row">
      <div class="stat-card income" role="button" tabindex="0" aria-label="查看本月收入详情">
        <div class="stat-label">💰 本月收入</div>
        <div class="stat-number" id="monthIncomeAmount">+RM0.00</div>
      </div>
      <div class="stat-card expense" role="button" tabindex="0" aria-label="查看本月支出详情">
        <div class="stat-label">💸 本月支出</div>
        <div class="stat-number" id="monthExpenseAmount">-RM0.00</div>
      </div>
      <div class="stat-card balance" role="button" tabindex="0" aria-label="查看本月结余详情">
        <div class="stat-label">🧾 本月结余</div>
        <div class="stat-number" id="monthBalanceAmount">RM0.00</div>
      </div>
    </div>

    <div class="date-header" id="swipeArea" role="button" tabindex="0" aria-label="滑动切换月份，点击选择日期">
      <div class="calendar-nav">
        <button class="nav-btn" id="prevMonth" aria-label="上个月">←</button>
        <div id="currentYearMonthDay"></div>
        <button class="nav-btn" id="nextMonth" aria-label="下个月">→</button>
      </div>
      <div class="selected-row">
        <div class="selected-label" id="selectedDateLabel"></div>
        <div class="selected-amount" id="selectedDateTotal">RM0.00</div>
      </div>
    </div>

    <div class="input-card">
      <div class="input-header">
        <div class="type-switch" id="typeSwitch" role="tablist" aria-label="收支类型切换">
          <div class="type-option expense active" data-type="expense" role="tab" aria-selected="true">💸 支出</div>
          <div class="type-option income" data-type="income" role="tab" aria-selected="false">💰 收入</div>
        </div>
        <div class="menu-container">
          <button class="menu-button" id="menuButton" aria-label="菜单" aria-expanded="false" aria-haspopup="true">☰</button>
          <div class="menu-dropdown" id="menuDropdown" role="menu">
            <div class="menu-item" id="installAppBtn" role="menuitem">📱 安装应用</div>
            <div class="menu-item" id="settingsMenuItem" role="menuitem">🎨 界面设置</div>
            <div class="menu-item" id="darkModeMenuItem" role="menuitem">🌙 暗色模式</div>
            <div class="menu-item" id="statisticsMenuItem" role="menuitem">📊 月度统计</div>
            <div class="menu-item" id="searchMenuItem" role="menuitem">🔍 搜索记录</div>
            <div class="menu-item" id="manageExpenseCategories" role="menuitem">📝 管理支出分类</div>
            <div class="menu-item" id="manageIncomeCategories" role="menuitem">💰 管理收入分类</div>
            <div class="menu-item" id="managePaymentTypes" role="menuitem">💳 管理支付方式</div>
            <div class="menu-item" id="exportNoteBtn" role="menuitem">📄 导出笔记（以文字分享）</div>
            <div class="menu-item" id="exportMenuItem" role="menuitem">📤 导出备份（可选月份）</div>
            <div class="menu-item" id="importMenuItem" role="menuitem">📥 导入备份（可选月份）</div>
            <div class="menu-item" id="clearDataMenuItem" role="menuitem">🗑 清空所有数据</div>
          </div>
        </div>
      </div>
      <div class="input-row">
        <div class="amount-box">
          <span id="currencySymbol">RM</span>
          <input type="text" id="amountInput" placeholder="0.00" inputmode="decimal" aria-label="金额">
        </div>
        <div class="category-wrapper">
          <input type="text" id="categoryInput" placeholder="输入或选择分类" aria-label="分类" autocomplete="off">
          <button class="dropdown-btn" id="dropdownBtn" aria-label="选择分类">▼</button>
          <div class="category-dropdown" id="categoryDropdown" role="listbox"></div>
        </div>
      </div>
    </div>

    <div class="calendar-card">
      <div class="weekdays" aria-hidden="true">
        <span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span><span>日</span>
      </div>
      <div class="calendar-grid" id="calendarGrid" role="grid" aria-label="日历"></div>
    </div>

    <div class="entries-header">
      <h4>📋 今日明细 <span id="entryCount"></span></h4>
      <div style="display:flex; align-items:center; gap:10px;">
        <span id="backupStatus">💾 尚未备份</span>
        <button class="view-more-btn" id="viewMoreBtn">查看全部</button>
      </div>
    </div>

    <ul class="entries-list" id="entriesList"></ul>
  </div>

  <button class="float-back-top" id="floatBackTop" aria-label="返回顶部">↑</button>

  <template id="modalTemplate">
    <div class="modal-overlay" role="dialog" aria-modal="true">
      <div class="modal-content">
        <div class="modal-header">
          <h3 class="modal-title"></h3>
          <button class="modal-close" aria-label="关闭">✕</button>
        </div>
        <div class="modal-body"></div>
        <div class="modal-footer"></div>
      </div>
    </div>
  </template>

  <!-- 按依赖顺序加载模块 -->
  <script type="module" src="js/app.js"></script>
</body>
</html>
