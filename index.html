          <button class="reset-btn" id="resetSettingsBtn">↺ 恢复默认设置</button>
        `;
        
        const modal = createModal('🎨 界面设置', html, '<button id="closeSettingsBtn" class="close-btn">关闭</button>');
        
        let tempExpenseColor = uiSettings.expenseColor;
        let tempIncomeColor = uiSettings.incomeColor;
        let tempCardBgColor = uiSettings.cardBg;
        let tempBgColor = uiSettings.bgColor;
        
        const expenseHue = modal.querySelector('#expenseHue');
        const expenseSat = modal.querySelector('#expenseSat');
        const expenseLight = modal.querySelector('#expenseLight');
        const expensePreview = modal.querySelector('#expensePreview');
        
        function updateExpensePreview() {
          let h = parseInt(expenseHue.value);
          let s = parseInt(expenseSat.value);
          let l = parseInt(expenseLight.value);
          let newColor = hslToHex(h, s, l);
          expensePreview.style.background = newColor;
          tempExpenseColor = newColor;
        }
        expenseHue.oninput = updateExpensePreview;
        expenseSat.oninput = updateExpensePreview;
        expenseLight.oninput = updateExpensePreview;
        
        const incomeHue = modal.querySelector('#incomeHue');
        const incomeSat = modal.querySelector('#incomeSat');
        const incomeLight = modal.querySelector('#incomeLight');
        const incomePreview = modal.querySelector('#incomePreview');
        
        function updateIncomePreview() {
          let h = parseInt(incomeHue.value);
          let s = parseInt(incomeSat.value);
          let l = parseInt(incomeLight.value);
          let newColor = hslToHex(h, s, l);
          incomePreview.style.background = newColor;
          tempIncomeColor = newColor;
        }
        incomeHue.oninput = updateIncomePreview;
        incomeSat.oninput = updateIncomePreview;
        incomeLight.oninput = updateIncomePreview;
        
        const cardBgHue = modal.querySelector('#cardBgHue');
        const cardBgSat = modal.querySelector('#cardBgSat');
        const cardBgLight = modal.querySelector('#cardBgLight');
        const cardBgPreview = modal.querySelector('#cardBgPreview');
        
        function updateCardBgPreview() {
          let h = parseInt(cardBgHue.value);
          let s = parseInt(cardBgSat.value);
          let l = parseInt(cardBgLight.value);
          let newColor = hslToHex(h, s, l);
          cardBgPreview.style.background = newColor;
          tempCardBgColor = newColor;
        }
        cardBgHue.oninput = updateCardBgPreview;
        cardBgSat.oninput = updateCardBgPreview;
        cardBgLight.oninput = updateCardBgPreview;
        
        const bgHue = modal.querySelector('#bgHue');
        const bgSat = modal.querySelector('#bgSat');
        const bgLight = modal.querySelector('#bgLight');
        const bgPreview = modal.querySelector('#bgPreview');
        
        function updateBgPreview() {
          let h = parseInt(bgHue.value);
          let s = parseInt(bgSat.value);
          let l = parseInt(bgLight.value);
          let newColor = hslToHex(h, s, l);
          bgPreview.style.background = newColor;
          tempBgColor = newColor;
        }
        bgHue.oninput = updateBgPreview;
        bgSat.oninput = updateBgPreview;
        bgLight.oninput = updateBgPreview;
        
        modal.querySelectorAll('#themeButtons .theme-btn').forEach(btn => {
          btn.onclick = () => {
            const theme = THEMES[btn.dataset.theme];
            if (theme) {
              tempExpenseColor = theme.expense;
              tempIncomeColor = theme.income;
              tempCardBgColor = theme.cardBg;
              tempBgColor = theme.bg;
              
              let newExpense = hexToHsl(tempExpenseColor);
              let newIncome = hexToHsl(tempIncomeColor);
              let newCardBg = hexToHsl(tempCardBgColor);
              let newBg = hexToHsl(tempBgColor);
              
              expenseHue.value = newExpense.h;
              expenseSat.value = newExpense.s;
              expenseLight.value = newExpense.l;
              incomeHue.value = newIncome.h;
              incomeSat.value = newIncome.s;
              incomeLight.value = newIncome.l;
              cardBgHue.value = newCardBg.h;
              cardBgSat.value = newCardBg.s;
              cardBgLight.value = newCardBg.l;
              bgHue.value = newBg.h;
              bgSat.value = newBg.s;
              bgLight.value = newBg.l;
              
              expensePreview.style.background = tempExpenseColor;
              incomePreview.style.background = tempIncomeColor;
              cardBgPreview.style.background = tempCardBgColor;
              bgPreview.style.background = tempBgColor;
            }
          };
        });
        
        const spacingSlider = modal.querySelector('#spacingGap');
        const spacingVal = modal.querySelector('#spacingValue');
        const paddingSlider = modal.querySelector('#cardPadding');
        const paddingVal = modal.querySelector('#paddingValue');
        const fontSizeSlider = modal.querySelector('#fontSize');
        const fontVal = modal.querySelector('#fontValue');
        
        spacingSlider.oninput = () => {
          uiSettings.spacingGap = parseInt(spacingSlider.value);
          spacingVal.innerText = uiSettings.spacingGap + 'px';
          applyUISettings();
        };
        paddingSlider.oninput = () => {
          uiSettings.cardPadding = parseInt(paddingSlider.value);
          paddingVal.innerText = uiSettings.cardPadding + 'px';
          applyUISettings();
        };
        fontSizeSlider.oninput = () => {
          uiSettings.fontSize = parseInt(fontSizeSlider.value);
          fontVal.innerText = uiSettings.fontSize + 'px';
          applyUISettings();
        };
        
        modal.querySelector('#resetSettingsBtn').onclick = () => {
          uiSettings = {
            cardRadius: 24,
            cardPadding: 16,
            statPadding: 8,
            inputPadding: 12,
            fontSize: 18,
            expenseColor: '#c2413a',
            incomeColor: '#2dd4bf',
            spacingGap: 6,
            bgColor: '#f1f5f9',
            cardBg: '#ffffff',
            darkMode: uiSettings.darkMode
          };
          applyUISettings();
          modal.remove();
          openSettingsPanel();
          showToast('已恢复默认设置');
        };
        
        modal.querySelector('#closeSettingsBtn').onclick = () => {
          uiSettings.expenseColor = tempExpenseColor;
          uiSettings.incomeColor = tempIncomeColor;
          uiSettings.cardBg = tempCardBgColor;
          uiSettings.bgColor = tempBgColor;
          saveSettings();
          modal.remove();
          showToast('设置已保存');
        };
      }

      function initBackToTop() {
        const backTopBtn = document.getElementById('floatBackTop');
        
        window.addEventListener('scroll', () => {
          if (window.scrollY > 300) {
            backTopBtn.classList.add('show');
          } else {
            backTopBtn.classList.remove('show');
          }
        });
        
        backTopBtn.onclick = () => {
          window.scrollTo({ top: 0, behavior: 'smooth' });
        };
      }

      // ==================== 事件绑定 ====================
      function bindEvents() {
        // 金额输入格式化
        document.getElementById('amountInput').addEventListener('input', function(e) {
          let val = this.value;
          if (val === '.') {
            this.value = '0.';
            return;
          }
          val = val.replace(/[^\d.]/g, '');
          val = val.replace(/(\..*)\./g, '$1');
          if (val.length > 1 && val[0] === '0' && val[1] !== '.') {
            val = val.replace(/^0+/, '');
            if (val === '') val = '0';
          }
          this.value = val;
          updateInputColor();
        });

        document.getElementById('amountInput').addEventListener('blur', function() {
          let val = parseFloat(this.value);
          if (!isNaN(val) && val > 0) {
            this.value = val.toFixed(2);
          } else if (this.value === '' || this.value === '0') {
            this.value = '';
          }
        });

        // 金额框回车
        document.getElementById('amountInput').addEventListener('keypress', (e) => {
          if (e.key === 'Enter') {
            e.preventDefault();
            const amount = parseFloat(document.getElementById('amountInput').value);
            const category = document.getElementById('categoryInput').value.trim();
            
            if (!amount || amount <= 0) {
              showToast('请输入有效金额');
              return;
            }
            
            if (category) {
              addRecord();
            } else {
              showToast('请选择或输入分类');
              const catInput = document.getElementById('categoryInput');
              catInput.classList.add('highlight-category');
              setTimeout(() => catInput.classList.remove('highlight-category'), 800);
            }
          }
        });
        
        // 分类框回车
        document.getElementById('categoryInput').addEventListener('keypress', (e) => {
          if (e.key === 'Enter') {
            e.preventDefault();
            const category = document.getElementById('categoryInput').value.trim();
            const amount = parseFloat(document.getElementById('amountInput').value);
            
            if (!category) {
              showToast('请输入分类');
              return;
            }
            
            if (amount && amount > 0) {
              addRecord();
            } else {
              document.getElementById('amountInput').focus();
              showToast('请输入金额');
            }
          }
        });
        
        // 日历点击
        document.getElementById('calendarGrid').addEventListener('click', (e) => {
          let day = e.target.closest('.calendar-day');
          if (day && day.dataset.date) {
            selectedDate = day.dataset.date;
            let [yy, mm] = selectedDate.split('-');
            currentYear = parseInt(yy);
            currentMonth = parseInt(mm) - 1;
            renderCalendar();
            renderEntries();
          }
        });
        
        document.getElementById('prevMonth').onclick = () => changeMonth(-1);
        document.getElementById('nextMonth').onclick = () => changeMonth(1);
        
        // 滑动切换月份
        const swipeArea = document.getElementById('swipeArea');
        let touchStartX = 0;
        let isSwiping = false;
        
        swipeArea.addEventListener('touchstart', (e) => {
          touchStartX = e.changedTouches[0].screenX;
          isSwiping = true;
        });
        
        swipeArea.addEventListener('touchend', (e) => {
          if (!isSwiping) return;
          isSwiping = false;
          let diffX = e.changedTouches[0].screenX - touchStartX;
          if (Math.abs(diffX) > 50) {
            if (diffX > 0) {
              changeMonth(-1);
            } else {
              changeMonth(1);
            }
          }
        });
        
        // 菜单
        document.getElementById('menuButton').onclick = (e) => {
          e.stopPropagation();
          closeCategoryDropdown();
          let dropdown = document.getElementById('menuDropdown');
          dropdown.classList.toggle('show');
          document.getElementById('menuButton').setAttribute('aria-expanded', dropdown.classList.contains('show'));
        };
        
        document.addEventListener('click', (e) => {
          const isMenu = e.target.closest('.menu-container');
          const isCategory = e.target.closest('.category-wrapper');
          if (!isMenu) closeMenu();
          if (!isCategory) closeCategoryDropdown();
        });
        
        // 下拉按钮
        document.getElementById('dropdownBtn').onclick = (e) => {
          e.stopPropagation();
          let dropdown = document.getElementById('categoryDropdown');
          dropdown.classList.toggle('show');
          renderCategoryDropdown();
        };
        
        document.getElementById('categoryInput').onclick = (e) => {
          e.stopPropagation();
          let dropdown = document.getElementById('categoryDropdown');
          dropdown.classList.toggle('show');
          renderCategoryDropdown();
        };
        
        // 下拉选择分类
        document.getElementById('categoryDropdown').addEventListener('click', (e) => {
          const item = e.target.closest('.category-item');
          if (!item) return;
          e.stopPropagation();
          
          const selectedCat = item.getAttribute('data-cat') || item.innerText;
          document.getElementById('categoryInput').value = selectedCat;
          closeCategoryDropdown();
          
          const amount = parseFloat(document.getElementById('amountInput').value);
          
          if (amount && amount > 0) {
            addRecord();
          } else {
            document.getElementById('amountInput').focus();
            showToast('请输入金额');
          }
        });
        
        // 编辑删除
        document.getElementById('entriesList').addEventListener('click', (e) => {
          const editBtn = e.target.closest('.edit-btn');
          const deleteBtn = e.target.closest('.delete-btn');
          if (editBtn) {
            let id = editBtn.getAttribute('data-id');
            editEntry(id);
          } else if (deleteBtn) {
            let id = deleteBtn.getAttribute('data-id');
            
            const modal = createModal(
              '🗑 删除记录',
              '<div style="text-align:center; padding:8px 0;">确定要删除这条记录吗？<br><br>删除后无法恢复。</div>',
              '<div style="display:flex; gap:12px;"><button id="confirmDeleteBtn" style="flex:1; background:var(--expense-color); color:white; border:none; padding:12px; border-radius:32px; font-size:16px;">删除</button><button id="cancelDeleteBtn" style="flex:1; background:#e2e8f0; border:none; padding:12px; border-radius:32px; font-size:16px;">取消</button></div>'
            );
            
            modal.querySelector('#confirmDeleteBtn').onclick = () => {
              entries = entries.filter(e => String(e.id) !== String(id));
              rebuildStatsCache();
              save();
              renderCalendar();
              renderEntries();
              renderCategoryDropdown();
              showToast('已删除');
              modal.remove();
            };
            
            modal.querySelector('#cancelDeleteBtn').onclick = () => modal.remove();
          }
        });
        
        document.getElementById('viewMoreBtn').onclick = () => {
          showAllEntriesModal();
        };

        // 菜单项绑定（升级版）
        const clearBtn = document.getElementById('clearDataMenuItem');
        if (clearBtn && !clearBtn.dataset.bound) {
          clearBtn.dataset.bound = 'true';
          clearBtn.onclick = () => {
            clearAllData();
            closeMenu();
          };
        }

        document.getElementById('settingsMenuItem').onclick = () => { openSettingsPanel(); closeMenu(); };
        document.getElementById('darkModeMenuItem').onclick = () => { toggleDarkMode(); closeMenu(); };
        document.getElementById('statisticsMenuItem').onclick = () => { showStatistics(); closeMenu(); };
        document.getElementById('searchMenuItem').onclick = () => { showSearch(); closeMenu(); };
        document.getElementById('manageExpenseCategories').onclick = () => { openCategoryManager('expense'); closeMenu(); };
        document.getElementById('manageIncomeCategories').onclick = () => { openCategoryManager('income'); closeMenu(); };
        
        // 升级后的导出/导入
        document.getElementById('exportMenuItem').onclick = () => { 
          showExportDialog(); 
          closeMenu(); 
        };
        
        document.getElementById('importMenuItem').onclick = () => { 
          showImportDialog(); 
          closeMenu(); 
        };
        
        document.getElementById('creditMenuItem').onclick = () => { closeMenu(); window.location.href = 'credit.html'; };
        
        document.querySelectorAll('.type-option').forEach(opt => {
          opt.onclick = () => {
            document.querySelectorAll('.type-option').forEach(o => o.classList.remove('active'));
            opt.classList.add('active');
            currentType = opt.dataset.type;
            renderCategoryDropdown();
            updateInputColor();
          };
        });
      }

      // ==================== PWA 相关 ====================
      window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        deferredPrompt = e;
        setTimeout(() => {
          const btn = document.getElementById('installBtn');
          if (btn) btn.style.display = 'block';
        }, 100);
      });

      window.addEventListener('appinstalled', () => {
        const btn = document.getElementById('installBtn');
        if (btn) btn.style.display = 'none';
      });

      const isIOS = () => {
        return /iphone|ipad|ipod/i.test(navigator.userAgent) ||
          (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
      };

      // ==================== 初始化 ====================
      window.onload = function () {
        load();
        rebuildStatsCache();
        bindEvents();
        renderCalendar();
        renderEntries();
        renderCategoryDropdown();
        updateInputColor();
        initBackToTop();
      };

      window.addEventListener('load', () => {
        if (isIOS() && !('standalone' in window.navigator && window.navigator.standalone)) {
          setTimeout(() => { showToast('👉 点击分享 → 添加到主屏幕'); }, 2000);
        }

        const btn = document.getElementById('installBtn');
        if (btn && !btn.dataset.bound) {
          btn.dataset.bound = 'true';
          btn.addEventListener('click', async () => {
            if (!deferredPrompt) return;
            deferredPrompt.prompt();
            const choice = await deferredPrompt.userChoice;
            if (choice.outcome === 'accepted') showToast('安装成功 🎉');
            deferredPrompt = null;
            btn.style.display = 'none';
          });
        }

        if ('serviceWorker' in navigator) {
          window.addEventListener('load', () => {
            navigator.serviceWorker.register('/expense-record/sw.js')
              .then(reg => console.log('SW registered:', reg))
              .catch(err => console.error('SW registration failed:', err));
          });
        }
      });
    })();
  </script>
  <button id="installBtn" style="
    position: fixed;
    bottom: 80px;
    left: 50%;
    transform: translateX(-50%);
    padding: 10px 18px;
    border-radius: 30px;
    border: none;
    background: var(--expense-color);
    color: white;
    font-size: 14px;
    display: none;
    z-index: 999;
    box-shadow: 0 6px 20px rgba(0,0,0,0.2);
    cursor: pointer;
  ">
    📲 安装App
  </button>
</body>
</html>
