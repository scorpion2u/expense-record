<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>每日消费记录</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: #f5f7fa;
            padding: 8px;
            display: flex;
            justify-content: center;
            -webkit-text-size-adjust: 100%;
            text-size-adjust: 100%;
        }
        .container {
            max-width: 400px;
            width: 100%;
            position: relative;
        }
        /* 菜单区域 - 保持不变 */
        .menu-container {
            position: absolute;
            top: 5px;
            right: 5px;
            z-index: 100;
        }
        .menu-button {
            width: 40px;
            height: 40px;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.6rem;
            color: white;
            cursor: pointer;
            -webkit-backdrop-filter: blur(5px);
            backdrop-filter: blur(5px);
        }
        .menu-dropdown {
            position: absolute;
            top: 48px;
            right: 0;
            background: white;
            border-radius: 20px;
            width: 160px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
            display: none;
            z-index: 101;
        }
        .menu-dropdown.show {
            display: block;
        }
        .menu-item {
            padding: 14px;
            border-bottom: 1px solid #f0f4fa;
            cursor: pointer;
            color: #1e2e3c;
        }
        .menu-item:active {
            background: #f0f4fa;
        }
        .menu-item:last-child {
            border-bottom: none;
        }
        
        /* 头部卡片 */
        .header-card {
            background: linear-gradient(145deg, #2b3d4f, #1e2e3c);
            color: white;
            border-radius: 24px;
            padding: 14px 16px;
            margin-bottom: 8px;
        }
        .calendar-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
            padding-right: 40px;
        }
        .nav-btn {
            background: rgba(255, 255, 255, 0.2);
            border: none;
            color: white;
            width: 34px;
            height: 34px;
            border-radius: 30px;
            cursor: pointer;
            font-size: 1.1rem;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .nav-btn:active {
            background: rgba(255, 255, 255, 0.4);
            transform: scale(0.95);
        }
        .nav-row {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        #currentMonthYear {
            font-weight: 600;
            font-size: 1.2rem;
            min-width: 110px;
            text-align: center;
        }
        .selected-row {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-top: 4px;
        }
        .selected-label {
            font-size: 1rem;
            opacity: .9;
        }
        .month-total {
            font-size: 0.9rem;
            opacity: .8;
            margin-top: 2px;
        }
        .selected-amount {
            font-size: 2rem;
            font-weight: 700;
        }
        
        /* ===== 重点：可写可选输入区域 ===== */
        /* ===== 可写可选输入区域 ===== */
.input-card {
    background: white;
    border-radius: 24px;
    padding: 12px 14px;
    margin-bottom: 8px;
    display: flex;
    gap: 8px;
    flex-wrap: nowrap;  /* 防止换行 */
}

.amount-box {
    flex: 1;  /* 各占一半 */
    min-width: 0;  /* 移除最小宽度限制 */
    display: flex;
    align-items: center;
    background: #f2f6fc;
    border-radius: 40px;
    padding: 2px 16px;
}

.amount-box span {
    color: #c43e4c;
    margin-right: 6px;
    flex-shrink: 0;
}

.amount-box input {
    flex: 1;
    border: none;
    background: transparent;
    padding: 10px 0;
    outline: none;
    font-size: 1rem;
    width: 100%;
    min-width: 0;  /* 允许输入框缩小 */
}

.amount-box input[type="number"] {
    -moz-appearance: textfield;
}

.amount-box input[type="number"]::-webkit-outer-spin-button,
.amount-box input[type="number"]::-webkit-inner-spin-button {
    -webkit-appearance: none;
    margin: 0;
}
.amount-box input::placeholder {
    font-size: 1.0rem;  /* 和分类框保持一致 */
    color: #a0b8d0;
    opacity: 1;
}

/* 分类组合框容器 - 和金额框完全一样宽 */
.category-wrapper {
    flex: 1;  /* 和amount-box一样的flex:1，各占一半 */
    min-width: 0;  /* 移除最小宽度限制，让两个框真正相等 */
    position: relative;
    background: #f2f6fc;
    border-radius: 40px;
    display: flex;
    align-items: center;
    padding: 2px 16px;  /* 和amount-box完全一样的内边距 */
    gap: 4px;
}

.category-icon {
    color: #c43e4c;
    margin-right: 2px;
    font-size: 1rem;
    flex-shrink: 0;
}

/* 自定义可写可选下拉框 */
.category-combobox {
    flex: 1;
    position: relative;
    min-width: 0;  /* 允许缩小 */
}

#categoryInput {
    width: 100%;
    border: none;
    background: transparent;
    padding: 10px 0;
    outline: none;
    font-size: 1rem;
    min-width: 0;  /* 允许输入框缩小 */
}

/* 添加这段 - 控制placeholder文字大小 */
#categoryInput::placeholder {
    font-size: 0.80rem;  /* 调整这个值改变提示文字大小 */
    color: #a0b8d0;      /* 也可以调整颜色 */
    opacity: 1;
}

.dropdown-btn {
    background: transparent;
    border: none;
    padding: 0 4px;
    font-size: 1rem;
    cursor: pointer;
    color: #94a8bd;
    flex-shrink: 0;
}

.category-dropdown {
    position: absolute;
    top: 100%;
    left: 0;
    right: 0;
    background: white;
    border-radius: 16px;
    box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
    margin-top: 4px;
    z-index: 1000;
    display: none;
    max-height: 250px;
    overflow-y: auto;
}

.category-dropdown.show {
    display: block;
}

.category-item {
    padding: 12px 16px;
    cursor: pointer;
    border-bottom: 1px solid #f0f4fa;
    transition: background 0.2s;
}

.category-item:hover {
    background: #f5f9ff;
}

.category-item:active {
    background: #e8f0fe;
}

.category-item:last-child {
    border-bottom: none;
}

.category-item .emoji {
    margin-right: 8px;
}
        
        /* 日历表格 - 保持稳定 */
        .calendar-card {
            background: white;
            border-radius: 20px;
            padding: 8px;
            margin-bottom: 8px;
        }
        .weekdays {
            display: flex;
            width: 100%;
            margin-bottom: 4px;
            font-size: .8rem;
            color: #7f8fa0;
        }
        .weekdays span {
            flex: 1;
            text-align: center;
        }
        .weekdays span:last-child {
            color: #c43e4c;
        }
        .calendar-table {
            width: 100%;
            border-collapse: collapse;
            table-layout: fixed;
            background: #f8fafd;
            border-radius: 12px;
        }
        .calendar-table td {
            text-align: center;
            vertical-align: middle;
            padding: 6px 0;
            border: 1px solid #edeff2;
            background: #f8fafd;
            cursor: pointer;
            height: 52px;
        }
        .calendar-table td.selected {
            border: 2px solid #c43e4c;
            background: #fff0f2;
        }
        .calendar-day-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            line-height: 1.2;
        }
        .today-badge-table {
            font-size: 0.55rem;
            color: #c43e4c;
            font-weight: 600;
            background: rgba(196,62,76,0.1);
            padding: 1px 5px;
            border-radius: 10px;
            margin-bottom: 2px;
        }
        .day-number-table {
            font-weight: 500;
            font-size: 0.95rem;
        }
        .day-amount-table {
            font-size: 0.6rem;
            color: #c43e4c;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 100%;
            padding: 0 2px;
        }
        
        /* 明细列表 */
        .list-card {
            background: white;
            border-radius: 20px;
            padding: 12px;
            min-height: 120px;
        }
        .entries-list {
            list-style: none;
        }
        .entries-list li {
            background: #fafcff;
            border-radius: 14px;
            padding: 10px;
            margin-bottom: 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .entries-list li.deleting {
            opacity: 0;
            transform: translateX(100%);
            transition: opacity 0.3s, transform 0.3s;
        }
        .entry-note {
            font-weight: 500;
            color: #2b3d4f;
            margin-bottom: 2px;
            font-size: 1rem;
        }
        .entry-time {
            font-size: .7rem;
            color: #94a8bd;
        }
        .entry-amount {
            font-weight: 600;
            color: #c43e4c;
            font-size: 1rem;
            margin-right: 8px;
        }
        .delete-btn {
            cursor: pointer;
            opacity: 0.6;
            font-size: 1.1rem;
            padding: 4px;
        }
        .delete-btn:active {
            opacity: 1;
            transform: scale(1.2);
        }
        .empty-state {
            text-align: center;
            color: #b2c7dd;
            padding: 30px 20px;
        }
        .toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 10px 24px;
            border-radius: 40px;
            font-size: 0.9rem;
            z-index: 1000;
            backdrop-filter: blur(5px);
        }
        @keyframes toastIn {
            from { opacity: 0; transform: translateX(-50%) translateY(20px); }
            to { opacity: 1; transform: translateX(-50%) translateY(0); }
        }
        .amount-change {
            animation: pop 0.2s;
        }
        @keyframes pop {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); color: #ffd700; }
        }
        
        /* 管理分类的小按钮 */
        .manage-categories {
            margin-top: 8px;
            padding: 8px 12px;
            background: #f8fafd;
            border-radius: 30px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 0.9rem;
            color: #2b3d4f;
            cursor: pointer;
        }
        .manage-categories:active {
            background: #eef2f6;
        }
    </style>
</head>
<body>
<div class="container">
    <!-- 菜单按钮 -->
    <div class="menu-container">
        <div class="menu-button" id="menuButton">☰</div>
        <div class="menu-dropdown" id="menuDropdown">
            <div class="menu-item" id="exportMenuItem">📤 导出备份</div>
            <div class="menu-item" id="importMenuItem">📥 导入备份</div>
            <div class="menu-item" id="manageCategoriesMenuItem">⚙️ 管理分类</div>
        </div>
    </div>

    <!-- 头部卡片 -->
    <div class="header-card">
        <div class="calendar-nav">
            <div class="nav-row">
                <button class="nav-btn" id="prevMonth">←</button>
                <div id="currentMonthYear"></div>
                <button class="nav-btn" id="nextMonth">→</button>
            </div>
            <div style="width:40px;"></div>
        </div>
        <div class="selected-row">
            <div>
                <div class="selected-label" id="selectedDateLabel">今天</div>
                <div class="month-total" id="monthTotal">本月已消费 RM0</div>
            </div>
            <div class="selected-amount" id="selectedDateTotal">RM0.00</div>
        </div>
    </div>

    <!-- 可写可选输入区域 -->
    <div class="input-card">
        <div class="amount-box">
            <span>RM</span>
            <input type="number" id="amountInput" placeholder="0.00" step="0.01" min="0" inputmode="decimal">
        </div>
        
        <!-- 增强版分类组合框 -->
        <div class="category-wrapper">
            <span class="category-icon">📝</span>
            <div class="category-combobox">
                <input type="text" id="categoryInput" placeholder="输入或选择分类" autocomplete="off">
                <div class="category-dropdown" id="categoryDropdown"></div>
            </div>
            <button class="dropdown-btn" id="dropdownBtn">▼</button>
        </div>
    </div>

    <!-- 日历区域 -->
    <div class="calendar-card">
        <div class="weekdays">
            <span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span><span>日</span>
        </div>
        <table class="calendar-table" id="calendarTable"></table>
    </div>

    <!-- 明细列表 -->
    <div class="list-card">
        <ul class="entries-list" id="entriesList"></ul>
    </div>
</div>

<script>
    (function() {
        // 存储键名
        const STORAGE_KEY = 'expense_record_final'
        const CATEGORIES_KEY = 'expense_categories'
        
        // 默认分类（带emoji图标）
        const DEFAULT_CATEGORIES = [
            '🍳 早餐', '🍱 午餐', '🍽️ 晚餐', 
            '🛍️ 逛街', '🧴 用品', '🚗 交通', 
            '🎬 娱乐', '📚 学习', '🏠 家居', '其他'
        ]
        
        // 当前日期
        let currentDate = new Date()
        let selectedDateStr = getTodayStr()
        let currentMonth = currentDate.getMonth()
        let currentYear = currentDate.getFullYear()
        
        // DOM元素
        const elements = {
            calendarTable: document.getElementById('calendarTable'),
            entriesList: document.getElementById('entriesList'),
            currentMonthYear: document.getElementById('currentMonthYear'),
            selectedDateTotal: document.getElementById('selectedDateTotal'),
            monthTotal: document.getElementById('monthTotal'),
            selectedDateLabel: document.getElementById('selectedDateLabel'),
            amountInput: document.getElementById('amountInput'),
            categoryInput: document.getElementById('categoryInput'),
            dropdownBtn: document.getElementById('dropdownBtn'),
            categoryDropdown: document.getElementById('categoryDropdown'),
            menuDropdown: document.getElementById('menuDropdown'),
            menuButton: document.getElementById('menuButton')
        }
        
        // ========= 分类管理 =========
        function loadCategories() {
            try {
                const saved = localStorage.getItem(CATEGORIES_KEY)
                if (saved) {
                    const parsed = JSON.parse(saved)
                    return Array.isArray(parsed) ? parsed : DEFAULT_CATEGORIES
                }
            } catch (e) {}
            return DEFAULT_CATEGORIES
        }
        
        function saveCategories(categories) {
            localStorage.setItem(CATEGORIES_KEY, JSON.stringify(categories))
            renderCategoryDropdown()
        }
        
        // 渲染下拉菜单
        function renderCategoryDropdown() {
            const categories = loadCategories()
            const dropdown = elements.categoryDropdown
            if (!dropdown) return
            
            let html = ''
            categories.forEach(cat => {
                html += `<div class="category-item">${cat}</div>`
            })
            dropdown.innerHTML = html
            
            // 绑定点击事件
            dropdown.querySelectorAll('.category-item').forEach(item => {
                item.addEventListener('click', (e) => {
                    elements.categoryInput.value = item.textContent
                    dropdown.classList.remove('show')
                })
            })
        }
        
        // 显示/隐藏下拉菜单
        function toggleDropdown(show) {
            const dropdown = elements.categoryDropdown
            if (show === undefined) {
                dropdown.classList.toggle('show')
            } else if (show) {
                dropdown.classList.add('show')
            } else {
                dropdown.classList.remove('show')
            }
        }
        
        // ========= 记账核心 =========
        function getTodayStr(){
            const d = new Date()
            return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`
        }
        
        function loadEntries(){
            try {
                const s = localStorage.getItem(STORAGE_KEY)
                return s ? JSON.parse(s) : []
            } catch { return [] }
        }
        
        function saveEntries(entries){
            localStorage.setItem(STORAGE_KEY, JSON.stringify(entries))
            requestAnimationFrame(() => {
                renderCalendar()
                renderEntriesList()
                updateTotals()
            })
        }
        
        function showToast(msg, duration=1500){
            const old = document.querySelector('.toast')
            if(old) old.remove()
            const toast = document.createElement('div')
            toast.className = 'toast'
            toast.textContent = msg
            document.body.appendChild(toast)
            setTimeout(() => toast.remove(), duration)
        }
        
        function updateTotals() {
            updateSelectedTotal()
            updateMonthTotal()
        }
        
        function updateSelectedTotal(){
            const entries = loadEntries()
            const total = entries.filter(e => e.date === selectedDateStr).reduce((s, e) => s + e.amount, 0)
            const el = elements.selectedDateTotal
            el.innerText = 'RM' + total.toFixed(2)
            el.classList.add('amount-change')
            setTimeout(() => el.classList.remove('amount-change'), 200)
            
            const dateObj = new Date(selectedDateStr + 'T12:00:00')
            const weekdays = ['周日', '周一', '周二', '周三', '周四', '周五', '周六']
            elements.selectedDateLabel.innerText = (selectedDateStr === getTodayStr()) ? '今天' : weekdays[dateObj.getDay()]
        }
        
        function updateMonthTotal(){
            const entries = loadEntries()
            const total = entries.filter(e => {
                const [y, m] = e.date.split('-').map(Number)
                return y === currentYear && m === (currentMonth + 1)
            }).reduce((s, e) => s + e.amount, 0)
            elements.monthTotal.innerText = "本月已消费 RM" + total.toFixed(2)
        }
        
        // 渲染日历
        function renderCalendar(){
            const entries = loadEntries()
            const firstDay = new Date(currentYear, currentMonth, 1)
            let startCol = (firstDay.getDay() + 6) % 7
            const daysInMonth = new Date(currentYear, currentMonth + 1, 0).getDate()
            const todayStr = getTodayStr()
            
            let tableHtml = ''
            let cellCount = 0
            
            for (let row = 0; row < 6; row++) {
                tableHtml += '<tr>'
                for (let col = 0; col < 7; col++) {
                    const cellDateNum = cellCount - startCol + 1
                    let isCurrentMonth = (cellCount >= startCol && cellCount < startCol + daysInMonth)
                    let dateStr = ''
                    let totalAmount = 0
                    let isToday = false
                    let isSelected = false
                    
                    if (isCurrentMonth) {
                        dateStr = `${currentYear}-${String(currentMonth+1).padStart(2,'0')}-${String(cellDateNum).padStart(2,'0')}`
                        const dayEntries = entries.filter(e => e.date === dateStr)
                        totalAmount = dayEntries.reduce((s,e) => s + e.amount, 0)
                        isToday = (dateStr === todayStr)
                        isSelected = (dateStr === selectedDateStr)
                    }
                    
                    let tdClass = isSelected ? 'selected' : ''
                    let contentHtml = ''
                    
                    if (isCurrentMonth) {
                        contentHtml += '<div class="calendar-day-content">'
                        if (isToday) {
                            contentHtml += '<span class="today-badge-table">今天</span>'
                        }
                        contentHtml += `<span class="day-number-table">${cellDateNum}</span>`
                        if (totalAmount > 0) {
                            contentHtml += `<span class="day-amount-table">RM${totalAmount.toFixed(0)}</span>`
                        }
                        contentHtml += '</div>'
                        tableHtml += `<td class="${tdClass}" data-date="${dateStr}">${contentHtml}</td>`
                    } else {
                        tableHtml += `<td class="${tdClass}"> </td>`
                    }
                    
                    cellCount++
                }
                tableHtml += '</tr>'
            }
            
            elements.calendarTable.innerHTML = tableHtml
            elements.currentMonthYear.innerText = `${currentYear}年${currentMonth+1}月`
        }
        
        // 点击日历
        elements.calendarTable.addEventListener('click', (e) => {
            const td = e.target.closest('td')
            if (!td) return
            const dateStr = td.dataset.date
            if (dateStr) {
                selectedDateStr = dateStr
                renderCalendar()
                renderEntriesList()
                updateSelectedTotal()
            }
        })
        
        // 渲染明细列表
        function renderEntriesList(){
            const entries = loadEntries()
            const dayEntries = entries.filter(e => e.date === selectedDateStr)
            const ul = elements.entriesList
            if (dayEntries.length === 0) {
                ul.innerHTML = '<li class="empty-state">📝 点击日期添加记录</li>'
                return
            }
            dayEntries.sort((a,b) => b.id - a.id)
            const fragment = document.createDocumentFragment()
            dayEntries.forEach(e => {
                const li = document.createElement('li')
                li.dataset.id = e.id
                li.innerHTML = `<div>
                    <div class="entry-note">${escapeHtml(e.note)}</div>
                    <div class="entry-time">${e.time}</div>
                </div>
                <div style="display:flex; align-items:center">
                    <span class="entry-amount">-RM${e.amount.toFixed(2)}</span>
                    <span class="delete-btn" data-id="${e.id}">🗑</span>
                </div>`
                fragment.appendChild(li)
            })
            ul.innerHTML = ''
            ul.appendChild(fragment)
            
            document.querySelectorAll('.delete-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.stopPropagation()
                    const id = Number(btn.dataset.id)
                    const li = btn.closest('li')
                    if (li) deleteEntry(id, li)
                })
            })
        }
        
        function escapeHtml(unsafe) {
            return unsafe.replace(/[&<>"]/g, function(m) {
                if(m === '&') return '&amp;'
                if(m === '<') return '&lt;'
                if(m === '>') return '&gt;'
                if(m === '"') return '&quot;'
                return m
            })
        }
        
        function deleteEntry(id, liElement){
            if(!confirm('删除这条记录？')) return
            liElement.classList.add('deleting')
            let deleted = false
            const safeDelete = function() {
                if (deleted) return
                deleted = true
                liElement.removeEventListener('transitionend', onTransitionEnd)
                clearTimeout(fallbackTimer)
                if (liElement && liElement.parentNode) {
                    const entries = loadEntries().filter(e => e.id !== id)
                    saveEntries(entries)
                    showToast('✓ 已删除')
                }
            }
            const onTransitionEnd = (e) => {
                if (e.propertyName.includes('transform') || e.propertyName.includes('opacity')) safeDelete()
            }
            liElement.addEventListener('transitionend', onTransitionEnd)
            const fallbackTimer = setTimeout(safeDelete, 2000)
        }
        
        // 添加记账
        function addExpense(){
            const amount = parseFloat(elements.amountInput.value)
            if (!amount || amount <= 0) {
                showToast('请输入有效金额', 1000)
                elements.amountInput.focus()
                return
            }
            
            let category = elements.categoryInput.value.trim()
            if (!category) {
                category = '未分类'
            }
            
            const entries = loadEntries()
            entries.push({
                id: Date.now(),
                date: selectedDateStr,
                time: new Date().toLocaleTimeString('zh-CN', {hour12: false}),
                amount: amount,
                note: category  // 直接使用分类作为备注
            })
            saveEntries(entries)
            
            // 清空金额，保留分类方便连续记账
            elements.amountInput.value = ''
            // 不自动清空分类，方便连续记同一类
            elements.amountInput.focus()
            
            // 收起键盘
            if (document.activeElement) {
                document.activeElement.blur()
                document.body.focus()
            }
            
            showToast('✓ 记账成功')
        }
        
        // ========= 事件绑定 =========
        elements.amountInput.addEventListener('keypress', e => {
            if(e.key === 'Enter') {
                e.preventDefault()
                addExpense()
            }
        })
        
        elements.categoryInput.addEventListener('keypress', e => {
            if(e.key === 'Enter') {
                e.preventDefault()
                addExpense()
            }
        })
        
        // 下拉按钮点击
        elements.dropdownBtn.addEventListener('click', (e) => {
            e.stopPropagation()
            toggleDropdown()
        })
        
        // 点击其他地方关闭下拉
        document.addEventListener('click', (e) => {
            if (!elements.categoryWrapper?.contains(e.target)) {
                toggleDropdown(false)
            }
        })
        
        // 为方便定位，把categoryWrapper补上
        elements.categoryWrapper = document.querySelector('.category-wrapper')
        
        // 点击输入框时如果下拉没显示，可以显示
        elements.categoryInput.addEventListener('click', (e) => {
            e.stopPropagation()
            toggleDropdown(true)
        })
        
        // 月份切换
        function changeMonth(delta){
            currentMonth += delta
            if (currentMonth < 0) { currentMonth = 11; currentYear-- }
            else if (currentMonth > 11) { currentMonth = 0; currentYear++ }
            selectedDateStr = `${currentYear}-${String(currentMonth+1).padStart(2,'0')}-01`
            renderCalendar()
            renderEntriesList()
            updateTotals()
        }
        
        document.getElementById('prevMonth').onclick = () => changeMonth(-1)
        document.getElementById('nextMonth').onclick = () => changeMonth(1)
        
        // 菜单控制
        elements.menuButton.onclick = (e) => {
            e.stopPropagation()
            elements.menuDropdown.classList.toggle('show')
        }
        
        document.addEventListener('click', (e) => {
            if (!elements.menuButton.contains(e.target) && !elements.menuDropdown.contains(e.target)) {
                elements.menuDropdown.classList.remove('show')
            }
        })
        
        // 导出备份
        document.getElementById('exportMenuItem').onclick = () => {
            const entries = loadEntries()
            const categories = loadCategories()
            const backup = { entries, categories, version: '1.0' }
            const dataStr = JSON.stringify(backup, null, 2)
            const blob = new Blob([dataStr], {type: 'application/json'})
            const url = URL.createObjectURL(blob)
            const a = document.createElement('a')
            a.href = url
            a.download = `记账备份_${new Date().toISOString().slice(0,10)}.json`
            a.click()
            URL.revokeObjectURL(url)
            showToast('✓ 导出成功')
            elements.menuDropdown.classList.remove('show')
        }
        
        // 导入备份
        document.getElementById('importMenuItem').onclick = () => {
            const input = document.createElement('input')
            input.type = 'file'
            input.accept = '.json'
            input.onchange = (e) => {
                const file = e.target.files[0]
                const reader = new FileReader()
                reader.onload = (e) => {
                    try {
                        const backup = JSON.parse(e.target.result)
                        // 支持新版备份格式
                        if (backup.entries && Array.isArray(backup.entries)) {
                            saveEntries(backup.entries)
                            if (backup.categories && Array.isArray(backup.categories)) {
                                saveCategories(backup.categories)
                            }
                            showToast('✓ 导入成功')
                        } 
                        // 兼容旧版
                        else if (Array.isArray(backup)) {
                            saveEntries(backup)
                            showToast('✓ 导入成功')
                        }
                        else {
                            showToast('❌ 文件格式错误')
                        }
                    } catch { showToast('❌ 导入失败') }
                }
                reader.readAsText(file)
                elements.menuDropdown.classList.remove('show')
            }
            input.click()
        }
        
        // 管理分类
        document.getElementById('manageCategoriesMenuItem').onclick = () => {
            const categories = loadCategories()
            let input = prompt('请输入分类（用逗号分隔，例如：早餐,午餐,晚餐,逛街）', categories.join(','))
            if (input !== null) {
                const newCats = input.split(',').map(s => s.trim()).filter(s => s)
                if (newCats.length > 0) {
                    saveCategories(newCats)
                    showToast('✓ 分类已更新')
                }
            }
            elements.menuDropdown.classList.remove('show')
        }
        
        // 初始化
        renderCategoryDropdown()
        renderCalendar()
        renderEntriesList()
        updateTotals()
    })()
</script>
</body>
</html>
