<!DOCTYPE html>
<html lang="zh">
   <head>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
      <title>收支记账本</title>
      <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
      <style>
         * {
         box-sizing: border-box;
         margin: 0;
         padding: 0;
         -webkit-tap-highlight-color: transparent;
         }
         body {
         font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
         padding: 10px 10px;
         display: flex;
         justify-content: center;
         transition: background 0.3s ease, color 0.2s ease;
         }
         :root {
         --card-radius: 24px;
         --card-padding: 16px;
         --stat-padding: 8px;
         --input-padding: 12px;
         --font-size-base: 18px;
         --expense-color: #c2413a;
         --income-color: #2dd4bf;
         --spacing-gap: 6px;
         --bg-color: #f1f5f9;
         --card-bg: #ffffff;
         }
         body {
         font-size: var(--font-size-base);
         background: var(--bg-color);
         }
         .container {
         max-width: 500px;
         width: 100%;
         margin: 0 auto;
         }
         body, .stat-card, .input-card, .calendar-card, .list-card, 
         .date-header, .amount-box, .category-wrapper, .calendar-day {
         transition: background 0.3s ease, border-color 0.2s ease, box-shadow 0.2s ease, color 0.2s ease;
         }
         .stats-row {
         display: flex;
         gap: var(--spacing-gap);
         margin-bottom: calc(var(--spacing-gap) + 2px);
         }
         .stat-card {
         flex: 1;
         background: var(--card-bg);
         border-radius: var(--card-radius);
         padding: var(--stat-padding) 4px;
         text-align: center;
         box-shadow: 0 2px 8px rgba(0, 0, 0, 0.03);
         border: 1px solid rgba(0,0,0,0.05);
         }
         .stat-label {
         font-size: calc(var(--font-size-base) * 0.65);
         font-weight: 500;
         color: #6c7a8e;
         display: flex;
         align-items: center;
         justify-content: center;
         gap: 3px;
         margin-bottom: 4px;
         }
         .stat-number {
         font-size: calc(var(--font-size-base) * 1.1);
         font-weight: 700;
         font-variant-numeric: tabular-nums;
         white-space: nowrap;
         }
         .stat-card.income .stat-number { color: var(--income-color); }
         .stat-card.expense .stat-number { color: var(--expense-color); }
         .stat-card.balance .stat-number.positive { color: var(--income-color); }
         .stat-card.balance .stat-number.negative { color: var(--expense-color); }
         .date-header, .input-card, .calendar-card, .list-card {
         background: var(--card-bg);
         border-radius: var(--card-radius);
         border: 1px solid rgba(0,0,0,0.05);
         margin-bottom: var(--spacing-gap);
         }
         .date-header { padding: calc(var(--card-padding) - 2px) var(--card-padding); }
         .calendar-nav {
         display: flex;
         justify-content: space-between;
         align-items: baseline;
         margin-bottom: 6px;
         }
         .nav-btn {
         background: rgba(0,0,0,0.05);
         border: none;
         width: 32px;
         height: 32px;
         border-radius: 28px;
         font-size: 1rem;
         cursor: pointer;
         color: #334155;
         transition: transform 0.1s ease;
         }
         .nav-btn:active { background: rgba(0,0,0,0.1); transform: scale(0.96); }
         #currentYearMonthDay {
         font-weight: 600;
         font-size: calc(var(--font-size-base) * 1);
         color: #0f172a;
         }
         .selected-row {
         display: flex;
         justify-content: space-between;
         align-items: baseline;
         margin-top: 2px;
         flex-wrap: wrap;
         gap: 6px;
         }
         .selected-label {
         font-size: calc(var(--font-size-base) * 0.75);
         color: #475569;
         background: rgba(0,0,0,0.04);
         padding: 3px 10px;
         border-radius: 24px;
         }
         .selected-amount {
         font-size: calc(var(--font-size-base) * 1.2);
         font-weight: 700;
         }
         .selected-amount.positive { color: var(--income-color); }
         .selected-amount.negative { color: var(--expense-color); }
         .input-card { padding: var(--card-padding); }
         .input-header {
         display: flex;
         justify-content: space-between;
         align-items: center;
         margin-bottom: calc(var(--card-padding) - 4px);
         }
         .type-switch {
         display: flex;
         background: rgba(0,0,0,0.05);
         border-radius: 32px;
         padding: 2px;
         gap: 3px;
         }
         .type-option {
         padding: 5px 14px;
         border-radius: 28px;
         font-weight: 600;
         font-size: calc(var(--font-size-base) * 0.8);
         cursor: pointer;
         color: #5b6e8c;
         transition: all 0.2s;
         }
         .type-option.expense.active { background: var(--card-bg); color: var(--expense-color); }
         .type-option.income.active { background: var(--card-bg); color: var(--income-color); }
         .menu-container { position: relative; }
         .menu-button {
         width: 34px;
         height: 34px;
         background: rgba(0,0,0,0.05);
         border-radius: 28px;
         display: flex;
         align-items: center;
         justify-content: center;
         font-size: 1.2rem;
         cursor: pointer;
         transition: transform 0.1s;
         }
         .menu-button:active { transform: scale(0.95); }
         .menu-dropdown {
         position: absolute;
         top: 40px;
         right: 0;
         background: var(--card-bg);
         border-radius: 20px;
         width: 170px;
         box-shadow: 0 10px 24px rgba(0,0,0,0.12);
         display: none;
         z-index: 200;
         overflow: hidden;
         }
         .menu-dropdown.show { display: block; }
         .menu-item {
         padding: 10px 14px;
         font-size: calc(var(--font-size-base) * 0.85);
         border-bottom: 1px solid rgba(0,0,0,0.05);
         cursor: pointer;
         color: #1e293b;
         transition: background 0.1s;
         }
         .menu-item:active { background: rgba(0,0,0,0.03); }
         .input-row {
         display: flex;
         gap: 10px;
         align-items: center;
         }
         .amount-box {
         flex: 1;
         background: rgba(0,0,0,0.03);
         border-radius: 40px;
         display: flex;
         align-items: center;
         padding: 2px 14px;
         transition: all 0.2s ease;
         }
         .amount-box span {
         font-weight: 500;
         margin-right: 4px;
         font-size: calc(var(--font-size-base) * 0.85);
         transition: color 0.2s ease;
         }
         .amount-box input {
         flex: 1;
         border: none;
         background: transparent;
         padding: var(--input-padding) 0;
         outline: none;
         font-size: calc(var(--font-size-base) * 0.9);
         width: 100%;
         color: #1e293b;
         }
         .amount-box input::placeholder {
         color: #9ca3af;
         }
         .amount-box:focus-within {
         box-shadow: 0 0 0 2px var(--focus-color);
         background: rgba(0,0,0,0.05);
         }
         .category-wrapper:focus-within {
         box-shadow: 0 0 0 2px var(--focus-color);
         background: rgba(0,0,0,0.05);
         }
         .category-wrapper {
         flex: 1;
         position: relative;
         background: rgba(0,0,0,0.03);
         border-radius: 40px;
         display: flex;
         align-items: center;
         padding: 2px 12px;
         gap: 4px;
         transition: all 0.2s ease;
         }
         #categoryInput {
         flex: 1;
         border: none;
         background: transparent;
         padding: var(--input-padding) 0;
         outline: none;
         font-size: calc(var(--font-size-base) * 0.85);
         width: 100%;
         color: #1e293b;
         cursor: pointer;
         }
         #categoryInput::placeholder {
         color: #9ca3af;
         }
         .dropdown-btn {
         background: transparent;
         border: none;
         font-size: calc(var(--font-size-base) * 0.8);
         color: #7e8b9e;
         cursor: pointer;
         padding: 0 2px;
         }
         .category-dropdown {
         position: absolute;
         top: calc(100% + 5px);
         left: 0;
         right: 0;
         background: var(--card-bg);
         border-radius: 18px;
         box-shadow: 0 8px 20px rgba(0,0,0,0.15);
         z-index: 150;
         display: none;
         max-height: 220px;
         overflow-y: auto;
         border: 1px solid rgba(0,0,0,0.1);
         }
         .category-dropdown.show { display: block; }
         .category-item {
         padding: 12px 14px;
         cursor: pointer;
         border-bottom: 1px solid rgba(0,0,0,0.05);
         font-size: calc(var(--font-size-base) * 0.85);
         transition: background 0.1s;
         }
         .category-item:last-child { border-bottom: none; }
         .category-item:active { background: rgba(0,0,0,0.05); }
         .category-item.active-cat {
         background: var(--focus-color);
         color: white;
         }
         .calendar-card { padding: calc(var(--card-padding) - 2px) calc(var(--card-padding) - 2px) calc(var(--card-padding) - 4px); }
         .weekdays {
         display: grid;
         grid-template-columns: repeat(7, 1fr);
         text-align: center;
         margin-bottom: 6px;
         font-size: calc(var(--font-size-base) * 0.7);
         font-weight: 500;
         color: #6c7a8e;
         }
         .weekdays span:last-child { color: var(--expense-color); }
         .calendar-grid {
         display: grid;
         grid-template-columns: repeat(7, 1fr);
         gap: 3px;
         }
         .calendar-day {
         aspect-ratio: 1;
         display: flex;
         flex-direction: column;
         align-items: center;
         justify-content: center;
         background: rgba(0,0,0,0.02);
         border-radius: 12px;
         cursor: pointer;
         font-size: calc(var(--font-size-base) * 0.75);
         border: 1px solid rgba(0,0,0,0.05);
         transition: all 0.1s ease;
         }
         .calendar-day:active { transform: scale(0.96); }
         .calendar-day.other-month { opacity: 0.4; }
         .calendar-day.today {
         background: rgba(194, 65, 58, 0.1);
         border-color: var(--expense-color);
         animation: breath 2s ease-in-out infinite;
         }
         .calendar-day.selected:not(.today) {
         border: 2px solid #3b82f6;
         background: rgba(59, 130, 246, 0.1);
         box-shadow: 0 0 0 1px rgba(59,130,246,0.2);
         animation: none;
         }
         @keyframes breath {
         0% {
         border-color: var(--expense-color);
         background: rgba(194, 65, 58, 0.1);
         box-shadow: 0 0 0px 0px rgba(194, 65, 58, 0.2);
         }
         50% {
         border-color: var(--expense-color);
         background: rgba(194, 65, 58, 0.25);
         box-shadow: 0 0 8px 3px rgba(194, 65, 58, 0.4);
         }
         100% {
         border-color: var(--expense-color);
         background: rgba(194, 65, 58, 0.1);
         box-shadow: 0 0 0px 0px rgba(194, 65, 58, 0.2);
         }
         }
         .day-number { font-weight: 500; }
         .day-expense { font-size: calc(var(--font-size-base) * 0.5); color: var(--expense-color); margin-top: 1px; }
         .day-income { font-size: calc(var(--font-size-base) * 0.5); color: var(--income-color); margin-top: 1px; }
         .list-card { padding: calc(var(--card-padding) - 2px) var(--card-padding); margin-bottom: 8px; }
         .entries-header {
         display: flex;
         justify-content: space-between;
         align-items: center;
         margin-bottom: 8px;
         }
         .entries-header h4 { font-size: calc(var(--font-size-base) * 0.9); font-weight: 600; color: #1e293b; }
         .view-more-btn {
         background: none;
         border: none;
         color: var(--expense-color);
         font-size: calc(var(--font-size-base) * 0.7);
         cursor: pointer;
         }
         .entries-list { list-style: none; }
         .entries-list li {
         background: rgba(0,0,0,0.02);
         border-radius: 16px;
         padding: 8px 10px;
         margin-bottom: 6px;
         display: flex;
         justify-content: space-between;
         align-items: center;
         border: 1px solid rgba(0,0,0,0.05);
         transition: all 0.1s;
         }
         .entries-list li:active { transform: scale(0.98); }
         .entry-info { flex: 1; }
         .entry-note { font-weight: 500; font-size: calc(var(--font-size-base) * 0.85); color: #1e293b; }
         .entry-time { font-size: calc(var(--font-size-base) * 0.6); color: #8b9ab0; margin-top: 2px; }
         .entry-actions { display: flex; gap: 12px; align-items: center; }
         .entry-amount { font-weight: 700; font-size: calc(var(--font-size-base) * 0.85); }
         .entry-amount.expense { color: var(--expense-color); }
         .entry-amount.income { color: var(--income-color); }
         .edit-btn, .delete-btn { cursor: pointer; font-size: calc(var(--font-size-base) * 0.9); opacity: 0.6; transition: opacity 0.1s; }
         .edit-btn:active, .delete-btn:active { opacity: 1; transform: scale(0.95); }
         .empty-state { text-align: center; color: #a0b3cc; padding: 20px; font-size: calc(var(--font-size-base) * 0.8); }
         .toast {
         position: fixed;
         bottom: 20px;
         left: 50%;
         transform: translateX(-50%);
         background: #1e293b;
         color: white;
         padding: 8px 18px;
         border-radius: 32px;
         font-size: calc(var(--font-size-base) * 0.8);
         z-index: 1100;
         animation: fadeInOut 2s ease;
         }
         @keyframes fadeInOut {
         0% { opacity: 0; transform: translateX(-50%) translateY(10px); }
         15% { opacity: 1; transform: translateX(-50%) translateY(0); }
         85% { opacity: 1; transform: translateX(-50%) translateY(0); }
         100% { opacity: 0; transform: translateX(-50%) translateY(-10px); }
         }
         .modal-overlay {
         position: fixed;
         top: 0; left: 0;
         width: 100%; height: 100%;
         background: rgba(0, 0, 0, 0.5);
         display: flex;
         align-items: center;
         justify-content: center;
         z-index: 1000;
         animation: fadeIn 0.2s ease;
         }
         @keyframes fadeIn {
         from { opacity: 0; }
         to { opacity: 1; }
         }
         .settings-panel, .edit-panel, .search-panel, .category-manager {
         background: white;
         border-radius: 28px;
         padding: 20px;
         width: 90%;
         max-width: 360px;
         max-height: 85vh;
         overflow-y: auto;
         box-shadow: 0 20px 35px rgba(0,0,0,0.2);
         animation: slideUp 0.2s ease;
         }
         @keyframes slideUp {
         from { opacity: 0; transform: translateY(20px); }
         to { opacity: 1; transform: translateY(0); }
         }
         .settings-item {
         margin-bottom: 20px;
         border-bottom: 1px solid #f0f0f0;
         padding-bottom: 16px;
         }
         .settings-item:last-child { border-bottom: none; }
         .settings-label {
         font-size: 0.85rem;
         font-weight: 600;
         color: #334155;
         margin-bottom: 10px;
         display: block;
         }
         .settings-slider {
         width: 100%;
         margin: 8px 0;
         }
         .settings-value {
         font-size: 0.75rem;
         color: #6c7a8e;
         text-align: right;
         }
         .theme-buttons {
         display: flex;
         flex-wrap: wrap;
         gap: 8px;
         margin-top: 8px;
         }
         .theme-btn {
         flex: 1;
         min-width: 70px;
         padding: 8px 10px;
         border-radius: 28px;
         border: none;
         background: #f1f5f9;
         font-size: 0.7rem;
         cursor: pointer;
         transition: all 0.1s;
         }
         .theme-btn:active { transform: scale(0.96); background: #e2e8f0; }
         .reset-btn {
         background: #f1f5f9;
         border: none;
         padding: 10px;
         border-radius: 28px;
         width: 100%;
         margin-top: 10px;
         cursor: pointer;
         font-size: 0.85rem;
         color: #c2413a;
         transition: all 0.1s;
         }
         .reset-btn:active { background: #e2e8f0; transform: scale(0.98); }
         .close-settings-btn {
         margin-top: 12px;
         width: 100%;
         background: #f1f5f9;
         border: none;
         padding: 10px;
         border-radius: 28px;
         cursor: pointer;
         font-size: 0.85rem;
         transition: all 0.1s;
         }
         .close-settings-btn:active { background: #e2e8f0; transform: scale(0.98); }
         .hsl-row {
         display: flex;
         align-items: center;
         gap: 12px;
         margin-top: 8px;
         }
         .hsl-sub-slider { flex: 1; }
         .color-preview-block {
         width: 40px;
         height: 40px;
         border-radius: 12px;
         border: 1px solid #ddd;
         }
         .hsl-group { margin-top: 8px; }
         .hsl-sub-label { width: 36px; font-size: 0.7rem; color: #6c7a8e; }
         .category-list-item {
         display: flex;
         justify-content: space-between;
         align-items: center;
         padding: 10px;
         border-bottom: 1px solid #edf2f7;
         font-size: 0.85rem;
         }
         .delete-cat-btn {
         background: #fee2e2;
         border: none;
         padding: 4px 10px;
         border-radius: 18px;
         color: var(--expense-color);
         cursor: pointer;
         font-size: 0.7rem;
         }
         .add-cat-input {
         display: flex;
         gap: 8px;
         margin-top: 14px;
         }
         .add-cat-input input {
         flex: 1;
         padding: 8px;
         border-radius: 28px;
         border: 1px solid #e2e8f0;
         outline: none;
         font-size: 0.85rem;
         }
         .add-cat-input button {
         background: var(--income-color);
         color: white;
         border: none;
         padding: 8px 14px;
         border-radius: 28px;
         cursor: pointer;
         font-size: 0.8rem;
         }
         /* 暗色模式 - 完整修复版 */
         body.dark-mode {
         --bg-color: #0f172a;
         --card-bg: #1e293b;
         }
         /* 基础卡片 */
         body.dark-mode .stat-card,
         body.dark-mode .input-card,
         body.dark-mode .calendar-card,
         body.dark-mode .list-card,
         body.dark-mode .date-header {
         border-color: rgba(255,255,255,0.15);
         background: var(--card-bg);
         }
         /* 统计卡片 */
         body.dark-mode .stat-label { color: #94a3b8; }
         body.dark-mode .stat-number { color: #f1f5f9; }
         body.dark-mode .stat-card.income .stat-number { color: var(--income-color); }
         body.dark-mode .stat-card.expense .stat-number { color: var(--expense-color); }
         body.dark-mode .stat-card.balance .stat-number.positive { color: #4ade80; }
         body.dark-mode .stat-card.balance .stat-number.negative { color: #f87171; }
         /* 选中日期 */
         body.dark-mode .selected-label {
         background: rgba(255,255,255,0.15);
         color: #cbd5e1;
         }
         body.dark-mode .selected-amount { color: #f1f5f9; }
         body.dark-mode .selected-amount.positive { 
         color: var(--income-color); 
         }
         body.dark-mode .selected-amount.negative { 
         color: var(--expense-color); 
         }
         /* 明细列表 */
         body.dark-mode .entries-header h4 { color: #f1f5f9; }
         body.dark-mode .entries-list li {
         background: rgba(255,255,255,0.08);
         border-color: rgba(255,255,255,0.1);
         }
         body.dark-mode .entry-note { color: #f1f5f9; }
         body.dark-mode .entry-time { color: #94a3b8; }
         body.dark-mode .entry-amount.expense { color: #f87171; }
         body.dark-mode .entry-amount.income { color: #4ade80; }
         body.dark-mode .empty-state { color: #94a3b8; }
         /* 输入框 */
         body.dark-mode .amount-box,
         body.dark-mode .category-wrapper {
         background: rgba(255,255,255,0.08);
         }
         body.dark-mode .amount-box input,
         body.dark-mode #categoryInput { color: #f1f5f9; }
         body.dark-mode .amount-box input::placeholder,
         body.dark-mode #categoryInput::placeholder { color: #94a3b8; }
         /* 分类下拉框 */
         body.dark-mode .category-dropdown {
         background: #1e293b;
         border-color: rgba(255,255,255,0.1);
         }
         body.dark-mode .category-item {
         color: #e2e8f0;
         border-bottom-color: rgba(255,255,255,0.1);
         }
         /* 菜单栏 */
         body.dark-mode .menu-button {
         background: rgba(255,255,255,0.15);
         color: #e2e8f0;
         }
         body.dark-mode .menu-dropdown {
         background: #1e293b;
         border: 1px solid rgba(255,255,255,0.1);
         }
         body.dark-mode .menu-item {
         color: #e2e8f0 !important;
         border-bottom-color: rgba(255,255,255,0.1);
         }
         /* 导航按钮 */
         body.dark-mode .nav-btn {
         background: rgba(255,255,255,0.12);
         color: #e2e8f0;
         }
         body.dark-mode .type-switch { background: rgba(255,255,255,0.12); }
         body.dark-mode .type-option { color: #94a3b8; }
         body.dark-mode .type-option.expense.active {
         color: var(--expense-color);
         }
         body.dark-mode .type-option.income.active {
         color: var(--income-color);
         }
         /* 日历 */
         body.dark-mode .weekdays { color: #94a3b8; }
         body.dark-mode .weekdays span:last-child { color: #f87171; }
         body.dark-mode #currentYearMonthDay { color: #f1f5f9; }
         body.dark-mode .calendar-day {
         background: rgba(255,255,255,0.06);
         border-color: rgba(255,255,255,0.1);
         color: #e2e8f0;
         }
         body.dark-mode .day-income { color: var(--income-color); }
         body.dark-mode .day-expense { color: var(--expense-color); }
         body.dark-mode .calendar-day.other-month {
         opacity: 0.5;
         color: #94a3b8;
         }
         body.dark-mode .calendar-day.today {

             function hslToHex(h, s, l) {
                 s /= 100;
                 l /= 100;
                 let c = (1 - Math.abs(2 * l - 1)) * s;
                 let x = c * (1 - Math.abs((h / 60) % 2 - 1));
                 let m = l - c / 2;
                 let r, g, b;
                 if (h < 60) { r = c; g = x; b = 0; }
                 else if (h < 120) { r = x; g = c; b = 0; }
                 else if (h < 180) { r = 0; g = c; b = x; }
                 else if (h < 240) { r = 0; g = x; b = c; }
                 else if (h < 300) { r = x; g = 0; b = c; }
                 else { r = c; g = 0; b = x; }
                 let toHex = (v) => Math.round((v + m) * 255).toString(16).padStart(2, '0');
                 return `#${toHex(r)}${toHex(g)}${toHex(b)}`;
             }
         
             function hexToHsl(hex) {
                 let r = parseInt(hex.slice(1,3), 16) / 255;
                 let g = parseInt(hex.slice(3,5), 16) / 255;
                 let b = parseInt(hex.slice(5,7), 16) / 255;
                 let max = Math.max(r, g, b), min = Math.min(r, g, b);
                 let h, s, l = (max + min) / 2;
                 if (max === min) h = s = 0;
                 else {
                     let d = max - min;
                     s = l > 0.5 ? d / (2 - max - min) : d / (max + min);
                     switch (max) {
                         case r: h = (g - b) / d + (g < b ? 6 : 0); break;
                         case g: h = (b - r) / d + 2; break;
                         case b: h = (r - g) / d + 4; break;
                     }
                     h *= 60;
                 }
                 return { h: Math.round(h), s: Math.round(s * 100), l: Math.round(l * 100) };
             }

             function save() {

                 localStorage.setItem(CAT_INCOME_KEY, JSON.stringify(incomeCats));
                 saveSettings();
             }
             
             function load() {
                 try {
                     let e = localStorage.getItem(STORAGE_KEY);
                     if(e) entries = JSON.parse(e);
                     let ec = localStorage.getItem(CAT_EXPENSE_KEY);
                     if(ec) expenseCats = JSON.parse(ec);
                     let ic = localStorage.getItem(CAT_INCOME_KEY);
                     if(ic) incomeCats = JSON.parse(ic);
                 } catch(e) {}
                 loadSettings();
             }
             
             function getCurrentCats() { return currentType === 'expense' ? expenseCats : incomeCats; }
             function showToast(msg) { let t = document.querySelector('.toast'); if(t) t.remove(); let toast = document.createElement('div'); toast.className = 'toast'; toast.textContent = msg; document.body.appendChild(toast); setTimeout(() => toast.remove(), 2000); }
             
             function getDayStats(date) {
                 let dayEntries = entries.filter(e => e.date === date);
                 let expense = dayEntries.filter(e => e.type === 'expense').reduce((s,e) => s + e.amount, 0);
                 let income = dayEntries.filter(e => e.type === 'income').reduce((s,e) => s + e.amount, 0);
                 return { expense, income, balance: income - expense };
             }
             
             function getMonthStats(year, month) {
                 let monthEntries = entries.filter(e => { let [y,m] = e.date.split('-').map(Number); return y === year && m === month + 1; });
                 let expense = monthEntries.filter(e => e.type === 'expense').reduce((s,e) => s + e.amount, 0);
                 let income = monthEntries.filter(e => e.type === 'income').reduce((s,e) => s + e.amount, 0);
                 return { expense, income, balance: income - expense };
             }
             
             function renderTopCards() {
                 let stats = getMonthStats(currentYear, currentMonth);
                 document.getElementById('monthIncomeAmount').innerHTML = stats.income > 0 ? `+RM${stats.income.toFixed(2)}` : 'RM0.00';
                 document.getElementById('monthExpenseAmount').innerHTML = stats.expense > 0 ? `-RM${stats.expense.toFixed(2)}` : 'RM0.00';
                 let balVal = stats.balance;
                 let balanceEl = document.getElementById('monthBalanceAmount');
                 if (balVal > 0) balanceEl.innerHTML = `+RM${balVal.toFixed(2)}`;
                 else if (balVal < 0) balanceEl.innerHTML = `-RM${Math.abs(balVal).toFixed(2)}`;
                 else balanceEl.innerHTML = 'RM0.00';
             }
             
             function renderSelectedDayTotal() {
                 let net = getDayStats(selectedDate).balance;
                 let totalEl = document.getElementById('selectedDateTotal');
                 if (net > 0) totalEl.innerHTML = `+RM${net.toFixed(2)}`;
                 else if (net < 0) totalEl.innerHTML = `-RM${Math.abs(net).toFixed(2)}`;
                 else totalEl.innerHTML = 'RM0.00';
                 totalEl.className = 'selected-amount';
                 if (net > 0) totalEl.classList.add('positive');
                 else if (net < 0) totalEl.classList.add('negative');
             }
             
             function updateCalendarDay(dateStr) {
                 let dayDiv = document.querySelector(`.calendar-day[data-date="${dateStr}"]`);
                 if (!dayDiv) return;
                 let stats = getDayStats(dateStr);
                 let isCurrentMonth = !dayDiv.classList.contains('other-month');
                 let oldExpense = dayDiv.querySelector('.day-expense');
                 let oldIncome = dayDiv.querySelector('.day-income');
                 if (oldExpense) oldExpense.remove();
                 if (oldIncome) oldIncome.remove();
                 if (isCurrentMonth && stats.expense > 0) {
                     let expenseSpan = document.createElement('div');
                     expenseSpan.className = 'day-expense';
                     expenseSpan.textContent = `-${stats.expense.toFixed(0)}`;
                     dayDiv.appendChild(expenseSpan);
                 }
                 if (isCurrentMonth && stats.income > 0) {
                     let incomeSpan = document.createElement('div');
                     incomeSpan.className = 'day-income';
                     incomeSpan.textContent = `+${stats.income.toFixed(0)}`;
                     dayDiv.appendChild(incomeSpan);
                 }
             }
             
             function renderCalendar() {
                 let year = currentYear, month = currentMonth;
                 let firstDay = new Date(year, month, 1);
                 let startOffset = firstDay.getDay() === 0 ? 6 : firstDay.getDay() - 1;
                 let daysInMonth = new Date(year, month + 1, 0).getDate();
                 let prevMonthDays = new Date(year, month, 0).getDate();
                 let grid = document.getElementById('calendarGrid');
                 grid.innerHTML = '';
                 let todayStr = getLocalDate();
                 
                 for(let i = 0; i < 42; i++) {
                     let dayNum, isCurrentMonth, displayYear, displayMonth, dateStr;
                     if(i < startOffset) {
                         dayNum = prevMonthDays - (startOffset - i) + 1;
                         isCurrentMonth = false;
                         displayYear = month === 0 ? year - 1 : year;
                         displayMonth = month === 0 ? 11 : month - 1;
                         dateStr = `${displayYear}-${String(displayMonth+1).padStart(2,'0')}-${String(dayNum).padStart(2,'0')}`;
                     } else if(i >= startOffset + daysInMonth) {
                         dayNum = i - (startOffset + daysInMonth) + 1;
                         isCurrentMonth = false;
                         displayYear = month === 11 ? year + 1 : year;
                         displayMonth = month === 11 ? 0 : month + 1;
                         dateStr = `${displayYear}-${String(displayMonth+1).padStart(2,'0')}-${String(dayNum).padStart(2,'0')}`;
                     } else {
                         dayNum = i - startOffset + 1;
                         isCurrentMonth = true;
                         dateStr = `${year}-${String(month+1).padStart(2,'0')}-${String(dayNum).padStart(2,'0')}`;
                     }
                     let stats = getDayStats(dateStr);
                     let dayDiv = document.createElement('div');
                     dayDiv.className = 'calendar-day';
                     if(dateStr === selectedDate) dayDiv.classList.add('selected');
                     if(dateStr === todayStr) dayDiv.classList.add('today');
                     if(!isCurrentMonth) dayDiv.classList.add('other-month');
                     dayDiv.setAttribute('data-date', dateStr);
                     dayDiv.innerHTML = `<div class="day-number">${dayNum}</div>`;
                     if(isCurrentMonth && stats.expense > 0) dayDiv.innerHTML += `<div class="day-expense">-${stats.expense.toFixed(0)}</div>`;
                     if(isCurrentMonth && stats.income > 0) dayDiv.innerHTML += `<div class="day-income">+${stats.income.toFixed(0)}</div>`;
                     grid.appendChild(dayDiv);
                 }
                 
                 let weekdays = ['星期日','星期一','星期二','星期三','星期四','星期五','星期六'];
                 let [y,m,day] = selectedDate.split('-');
                 let d = new Date(y, m-1, day);
                 let label = weekdays[d.getDay()];
                 let today = new Date();
                 if(d.toDateString() === today.toDateString()) label = `今天 · ${label}`;
                 document.getElementById('selectedDateLabel').innerHTML = label;
                 document.getElementById('currentYearMonthDay').innerText = `${year}年${month+1}月${day}日`;
                 renderTopCards();
                 renderSelectedDayTotal();
             }

             function editEntry(id) {
                 let entry = entries.find(e => e.id === id);

                 let modal = document.createElement('div');
                 modal.className = 'modal-overlay';

             function addRecord() {
                 if (isAdding) {
                     showToast('请稍后再试');
                     return false;
                 }
                 isAdding = true;
                 setTimeout(() => { isAdding = false; }, 500);
                 
                 let amount = parseFloat(document.getElementById('amountInput').value);
                 if(!amount || amount <= 0) { 
                     showToast('请输入金额'); 
                     isAdding = false; 
                     return false; 
                 }
                 
                 let category = document.getElementById('categoryInput').value.trim();
                 if(!category) category = currentType === 'expense' ? '其他支出' : '其他收入';
                 
                 entries.push({ 
                     id: crypto.randomUUID(),
                     timestamp: Date.now(),
                     date: selectedDate, 
                     time: new Date().toLocaleTimeString('zh-CN', {hour12: false}), 
                     amount, 
                     note: category, 
                     type: currentType 
                 });
                 
                 save();
                 
                 document.getElementById('amountInput').value = '';
                 document.getElementById('categoryInput').value = '';
                 document.getElementById('amountInput').focus();
                 
                 renderEntries();
                 renderTopCards();
                 renderSelectedDayTotal();
                 updateCalendarDay(selectedDate);
                 
                 showToast(currentType === 'expense' ? '支出已记' : '收入已记');
                 return true;
             }

            <div style="display: flex; gap: 10px; margin-bottom: 12px;">
                <div style="flex:1;">
                    <label style="font-size: 0.8rem; color: #64748b; display: block; margin-bottom: 4px;">最小金额 (RM)</label>
                    <input type="number" id="searchMinAmount" placeholder="0" step="0.01" style="width:100%; padding:8px; border-radius:28px; border:1px solid #e2e8f0; outline:none;">
                </div>
                <div style="flex:1;">
                    <label style="font-size: 0.8rem; color: #64748b; display: block; margin-bottom: 4px;">最大金额 (RM)</label>
                    <input type="number" id="searchMaxAmount" placeholder="不限" step="0.01" style="width:100%; padding:8px; border-radius:28px; border:1px solid #e2e8f0; outline:none;">
                </div>
            </div>
            
            <div style="margin-bottom: 16px;">
                <label style="font-size: 0.8rem; color: #64748b; display: block; margin-bottom: 8px;">收支类型</label>
                <div style="display: flex; gap: 12px;">
                    <label><input type="radio" name="searchType" value="all" checked> 全部</label>
                    <label><input type="radio" name="searchType" value="expense"> 💸 支出</label>
                    <label><input type="radio" name="searchType" value="income"> 💰 收入</label>
                </div>
            </div>
            
            <div style="display: flex; gap: 10px; margin-bottom: 16px;">
                <button id="doSearchBtn" style="flex:1; background: var(--expense-color); color: white; border: none; padding: 10px; border-radius: 28px;">🔍 搜索</button>
                <button id="resetSearchBtn" style="flex:1; background: #f1f5f9; border: none; padding: 10px; border-radius: 28px;">重置</button>
            </div>
            
            <div id="searchResults" style="max-height: 300px; overflow-y: auto; border-top: 1px solid #e2e8f0; padding-top: 12px;">
                <div style="text-align: center; color: #94a3b8; padding: 20px;">输入条件后点击搜索</div>

        </div>
    `;
    document.body.appendChild(modal);

    // ✅ 本地时间格式（避免时区 bug）
    function formatDateLocal(date) {
        let y = date.getFullYear();
        let m = String(date.getMonth() + 1).padStart(2, '0');
        let d = String(date.getDate()).padStart(2, '0');
        return `${y}-${m}-${d}`;
    }

    // ✅ 重置函数（统一逻辑）
    function resetSearch() {
        document.getElementById('searchKeyword').value = '';

        let today = new Date();
        let oneYearAgo = new Date();
        oneYearAgo.setFullYear(today.getFullYear() - 1);

        document.getElementById('searchStartDate').value = formatDateLocal(oneYearAgo);
        document.getElementById('searchEndDate').value = formatDateLocal(today);

        document.getElementById('searchMinAmount').value = '';
        document.getElementById('searchMaxAmount').value = '';
        document.querySelector('input[name="searchType"][value="all"]').checked = true;

        document.getElementById('searchResults').innerHTML =
            '<div style="text-align: center; color: #94a3b8; padding: 20px;">输入条件后点击搜索</div>';
    }

    // ✅ 打开时默认 = 近1年
    resetSearch();

    function performSearch() {
        let keyword = document.getElementById('searchKeyword').value.trim().toLowerCase();
        let startDate = document.getElementById('searchStartDate').value;
        let endDate = document.getElementById('searchEndDate').value;
        let minAmount = parseFloat(document.getElementById('searchMinAmount').value);
        let maxAmount = parseFloat(document.getElementById('searchMaxAmount').value);
        let type = document.querySelector('input[name="searchType"]:checked').value;

        let results = [...entries];

        if (startDate) results = results.filter(e => e.date >= startDate);
        if (endDate) results = results.filter(e => e.date <= endDate);
        if (keyword) results = results.filter(e => e.note.toLowerCase().includes(keyword));
        if (!isNaN(minAmount)) results = results.filter(e => e.amount >= minAmount);
        if (!isNaN(maxAmount)) results = results.filter(e => e.amount <= maxAmount);
        if (type !== 'all') results = results.filter(e => e.type === type);

        results.sort((a,b) => (b.timestamp || 0) - (a.timestamp || 0));

        let resultsDiv = document.getElementById('searchResults');

        if (!results.length) {
            resultsDiv.innerHTML = '<div style="text-align:center;color:#94a3b8;padding:20px;">📭 没有找到记录</div>';
            return;
        }

        let html = '';
        for (let e of results) {
            let sign = e.type === 'expense' ? '-' : '+';
            let color = e.type === 'expense' ? uiSettings.expenseColor : uiSettings.incomeColor;

            html += `
                <div style="padding:10px;border-bottom:1px solid #e2e8f0;display:flex;justify-content:space-between;">
                    <div>
                        <div>${escapeHtml(e.note)}</div>
                        <div style="font-size:0.6rem;color:#94a3b8;">${e.date} ${e.time}</div>
                    </div>
                    <div style="color:${color};font-weight:600;">
                        ${sign}RM${e.amount.toFixed(2)}
                    </div>
                </div>
            `;
        }

        resultsDiv.innerHTML = html;
    }

    document.getElementById('doSearchBtn').onclick = performSearch;
    document.getElementById('resetSearchBtn').onclick = resetSearch;
    document.getElementById('closeSearchBtn').onclick = () => modal.remove();

    modal.onclick = (e) => {
        if (e.target === modal) modal.remove();
    };
}
                 
             function exportBackup() {
  let data = {
    entries,
    expenseCats,
    incomeCats,
    uiSettings
  };

  let json = JSON.stringify(data, null, 2);

  // 📱 优先：系统分享（APK / 手机）
  if (navigator.share) {
    let blob = new Blob([json], { type: 'application/json' });
    let file = new File([blob], '记账备份.json', { type: 'application/json' });

    navigator.share({
      title: '记账备份',
      text: '我的记账数据备份',
      files: [file]
    }).then(() => {
      showToast('已分享备份 📤');
    }).catch(() => {
      showToast('已取消分享');
    });

  } else {
    // 💻 备用：浏览器下载（电脑 / 普通网页）
    let blob = new Blob([json], { type: 'application/json' });
    let url = URL.createObjectURL(blob);

    let a = document.createElement('a');
    a.href = url;
    a.download = '记账备份.json';
    a.click();

    URL.revokeObjectURL(url);

    showToast('已下载备份 📥');
  }
}
             function exportExcel() { if(!entries.length){showToast('无数据');return;} let csv="日期,时间,类型,分类,金额\n"; for(let e of entries){ let sign=e.type==='expense'?'-':'+'; csv+=`${e.date},${e.time},${e.type==='expense'?'支出':'收入'},${e.note},${sign}RM${e.amount.toFixed(2)}\n`; } let blob=new Blob(["\uFEFF"+csv],{type:'text/csv'}); let a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=`收支_${new Date().toISOString().slice(0,10)}.csv`; a.click(); showToast('导出CSV完成'); }
             function importBackup() { let input=document.createElement('input'); input.type='file'; input.accept='.json'; input.onchange=(e)=>{ let file=e.target.files[0]; let reader=new FileReader(); reader.onload=(ev)=>{ try{ let data=JSON.parse(ev.target.result); if(data.entries) {
             entries = data.entries.map(e => ({
                 ...e,
                 timestamp: e.timestamp || Date.now()
             }));
         } if(data.expenseCats) expenseCats=data.expenseCats; if(data.incomeCats) incomeCats=data.incomeCats; if(data.uiSettings) uiSettings={...uiSettings,...data.uiSettings}; save(); renderCalendar(); renderEntries(); renderCategoryDropdown(); showToast('导入成功'); }catch(e){showToast('文件格式错误');} }; reader.readAsText(file); }; input.click(); }
             
             function bindEvents() {
                 document.getElementById('calendarGrid').addEventListener('click',(e)=>{ let day=e.target.closest('.calendar-day'); if(day&&day.dataset.date){ selectedDate=day.dataset.date; let [yy,mm]=selectedDate.split('-'); currentYear=parseInt(yy); currentMonth=parseInt(mm)-1; displayLimit=5; renderCalendar(); renderEntries(); } });
                 document.getElementById('prevMonth').onclick=()=>changeMonth(-1);
                 document.getElementById('nextMonth').onclick=()=>changeMonth(1);
                 
                 let calendarCard = document.querySelector('.calendar-card');
                 let touchStartX = 0;
                 calendarCard.addEventListener('touchstart', (e) => { touchStartX = e.changedTouches[0].screenX; });
                 calendarCard.addEventListener('touchend', (e) => { let diff = e.changedTouches[0].screenX - touchStartX; if (Math.abs(diff) > 50) { if (diff > 0) changeMonth(-1); else changeMonth(1); } });
                 
                 document.getElementById('menuButton').onclick=(e)=>{ e.stopPropagation(); document.getElementById('menuDropdown').classList.toggle('show'); };

                     if(!e.target.closest('.menu-container')) document.getElementById('menuDropdown').classList.remove('show');

                 });

                 document.getElementById('categoryInput').onclick=(e)=>{ e.stopPropagation(); let dropdown = document.getElementById('categoryDropdown'); dropdown.classList.toggle('show'); renderCategoryDropdown(); };

                 document.getElementById('darkModeMenuItem').onclick=()=>{ toggleDarkMode(); document.getElementById('menuDropdown').classList.remove('show'); };

                 document.querySelectorAll('.type-option').forEach(opt=>{

                     }; 
                 });
                 
                 document.getElementById('amountInput').addEventListener('input', () => { updateInputColor(); });
                 document.getElementById('amountInput').addEventListener('keypress', e => {
    if (e.key === 'Enter') {
        e.preventDefault(); // 防止默认行为

        // 👉 跳到分类输入框
        const categoryInput = document.getElementById('categoryInput');

        // 👉 自动打开分类下拉（更顺手）

});
                 document.getElementById('categoryInput').addEventListener('keypress', e => {
    if (e.key === 'Enter') {
        e.preventDefault();
        addRecord();
    }
});
         
         document.getElementById('entriesList').addEventListener('click', (e) => {
             let editBtn = e.target.closest('.edit-btn');
             let deleteBtn = e.target.closest('.delete-btn');
         
             if (editBtn) {
                 let id = editBtn.getAttribute('data-id');
                 editEntry(id);
                 return;
             }
         
             if (deleteBtn) {
                 let id = deleteBtn.getAttribute('data-id');
         
                 if (confirm('删除记录？')) {
                     entries = entries.filter(e => String(e.id) !== String(id));
                     save();
                     renderCalendar();
                     renderEntries();
                     renderCategoryDropdown();
                     showToast('已删除');

             }
         });

             function escapeHtml(str) { if(!str) return ''; return str.replace(/[&<>]/g, function(m){ if(m==='&') return '&amp;'; if(m==='<') return '&lt;'; if(m==='>') return '&gt;'; return m;}); }
             
             load();
             bindEvents();
             renderCalendar();
             renderEntries();
             renderCategoryDropdown();
             updateInputColor();
const isIOS = () => {
  return /iphone|ipad|ipod/i.test(navigator.userAgent)
    || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
};
             window.addEventListener('load', () => {

  // 🍎 iOS 提示
  if (isIOS() &&
      !('standalone' in window.navigator && window.navigator.standalone)) {
    setTimeout(() => {
      showToast('👉 点击分享 → 添加到主屏幕');
    }, 2000);
  }

  // 📲 安装按钮点击
  const btn = document.getElementById('installBtn');

if (btn && !btn.dataset.bound) {
  btn.dataset.bound = 'true'; // 防止重复绑定

  btn.addEventListener('click', async () => {
      if (!deferredPrompt) return;

      deferredPrompt.prompt();
      const choice = await deferredPrompt.userChoice;

      if (choice.outcome === 'accepted') {
        showToast('安装成功 🎉');
      }

      deferredPrompt = null;
      btn.style.display = 'none';
    });
  }

  // 🚀 Service Worker（合并进来）
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('/expense-record/sw.js').then(reg => {
      console.log('PWA ready');

      reg.onupdatefound = () => {
        const newWorker = reg.installing;

        newWorker.onstatechange = () => {
          if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
            showToast('🔄 已更新，刷新生效');
          }
        };
      };

    }).catch(err => console.log(err));
  }

});
             
  
            
})();
